# 显式声明构建后端：package-data 依赖 setuptools>=61 读取 pyproject 配置，
# 不声明时打包行为随环境里碰巧解析到的工具链漂移（独立复查发现）。
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lingxi"
version = "0.1.0"
description = "Lingxi 企业内部受控 AI 业务分析服务"
requires-python = ">=3.12"

# extras 按**进程**分组，不按外部系统分组（Issue #56）。每组 = 从该进程入口
# 追 import 链得到的第三方依赖闭包，组名与 `python -m lingxi.apps.<name>` 对齐，
# 也就与 Docker Compose 的一个服务对齐（见 docs/技术设计/代码框架.md 第一、六节），
# 这样镜像构建只装该进程真正要用的东西。同一依赖出现在多个组里是正常的。
#
# 旧名 `feishu` 名实不符：它实际装的是 Bot-Test 受控验证那一整套（含与飞书无关的
# psycopg / cryptography），而正式的飞书目录适配器 `adapters/feishu_directory.py`
# 走裸 HTTP、根本不用 lark-oapi。旧名 `agent` 描述的是「依赖是什么」而不是
# 「谁需要它」，一并按进程改名。
#
# **`src/lingxi/` 里没有任何模块级第三方 import，全部是函数内延迟导入。**
# 因此「模块能 import 成功」证明不了依赖装上了——校验必须显式导入第三方模块本身，
# 见 scripts/ci/check_installed_package.py 的 `--process` 模式与 PROCESS_RUNTIME_IMPORTS。
[project.optional-dependencies]
# lingxi-scheduler 进程（`python -m lingxi.apps.scheduler`：专用授权凭据续期扫描）。
# 依据：入口 → adapters/delegated_credentials.py（cryptography.fernet、psycopg）；
# 同链上的 adapters/feishu_directory.py 只用标准库 urllib，故本组不含 lark-oapi。
# cryptography 精确锁版：Fernet 是宿主机凭据文件的安全边界，范围区间会让
# 依赖升级在代码未变时改变该边界（终轮 Codex）；升级须重跑凭据保管验证。
scheduler = ["cryptography==45.0.7", "psycopg[binary]>=3.2,<4"]
# lingxi-worker 进程（`python -m lingxi.apps.worker`：最薄受控执行器）。
# 依据：入口 → adapters/claude_agent_hooks.py、adapters/claude_agent_session.py。
# 精确锁版本，不用范围：执行层的只读边界建立在这个版本的 hook 事件名与工具名上
# （`PostToolUseFailure` 存在、子代理叫 `Agent` 不叫 `Task`、`HookMatcher` 的签名），
# 这些都是实测得到的、SDK 未作稳定性承诺的细节。升级前必须重跑 L4a，见
# docs/技术设计/验证与门禁.md 的 V-部署-08。
# 判定逻辑不依赖本组：`lingxi.core.execution` 的全部断言在无 SDK 环境即可跑，
# 绑定层的形状由桩模块锁住。CI 另有一步装上本组做真实冒烟（构造 `HookMatcher`，
# 不调模型、不用凭据），见 scripts/ci/check_agent_sdk_binding.py。
worker = ["claude-agent-sdk==0.2.128"]
# Bot-Test 受控验证资产（代码框架第五节列举的那一批），**不是正式生产进程**，
# 不进生产镜像。含常驻长连接进程 `adapters/feishu_onboarding.run_long_connection_bot`
# 与 `scripts/` 下的受控脚本。依据：
#   lark-oapi   → adapters/feishu_onboarding.py（LarkCardSender 发卡片、长连接收事件）
#   websockets  → adapters/oauth_bridge.py（OAuth 结果桥接长连接）
#   psycopg     → adapters/refresh_tokens.py、postgres_onboarding.py、galaxy_import.py 等
#   cryptography→ adapters/refresh_tokens.py（refresh_token 加密轮换）
# lark-oapi 保留为运行时依赖、不降为 CI-only：2026-08-06 产品负责人否决 #39 的替换
# 建议（登记见 #39 收口评论与 #57）。正式 gateway 进程（代码框架第一节「待建立」）
# 落地时，长连接与发消息的依赖再从本组提升为 `gateway` 组。
bot-test = [
    "cryptography==45.0.7",
    "lark-oapi==1.7.1",
    "psycopg[binary]>=3.2,<4",
    "websockets>=15,<16",
]
# 数据库迁移（Issue #53）。**这一组不是常驻进程**，是部署时跑一次的迁移作业：
# `LINGXI_MIGRATION_DSN=... python -m alembic upgrade head`。它单独成组而不是挂进
# scheduler，有三个理由：
#   1. 迁移要 DDL 权限、业务进程不要，两者本就该是不同的数据库角色；
#   2. `src/lingxi/` 里不得出现 sqlalchemy / alembic（断言 V-迁移-04），把它塞进
#      某个进程组等于声称那个进程运行时需要它，是假的；
#   3. 生产镜像因此不必为了跑业务而装上 SQLAlchemy。
# 窄区间而不是 `==`：按 2026-08-06 裁定①，alembic 属迁移工具链，不在运行时进程内，
# 不是 V-部署-08 所说的"安全边界组件"。上界不能省——alembic 的 revision 解析与
# 事务语义是次版本可变的，开区间等于允许它在代码没变时改变迁移行为。
# 传递依赖（`pip install '.[migrate]'` 实测闭包）：SQLAlchemy、Mako、MarkupSafe、greenlet。
migrate = ["alembic>=1.19,<1.20"]

# 角色职能映射是随包发布的配置文件，不是源码。不显式声明就不会进 wheel，
# 而缺失表现为「全部角色显示未映射」——一种看起来正常的失败。
# CI 的 scripts/ci/check_installed_package.py 校验它确实在已安装的制品里。
[tool.setuptools.package-data]
"lingxi.config" = ["*.toml"]

[tool.unittest]
start-directory = "tests"
