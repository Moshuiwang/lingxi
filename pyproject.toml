# 显式声明构建后端：package-data 依赖 setuptools>=61 读取 pyproject 配置，
# 不声明时打包行为随环境里碰巧解析到的工具链漂移（独立复查发现）。
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lingxi"
version = "2.0.0"
description = "Lingxi 企业内部受控 AI 业务分析服务"
requires-python = ">=3.12"

# extras 按**进程**分组，不按外部系统分组（Issue #56）。每组 = 从该进程入口
# 追 import 链得到的第三方依赖闭包，组名与 `python -m lingxi.apps.<name>` 对齐，
# 也就与 Docker Compose 的一个服务对齐（见 docs/技术设计/代码框架.md 第一、六节），
# 这样镜像构建只装该进程真正要用的东西。同一依赖出现在多个组里是正常的。
#
# 旧名 `feishu` 名实不符：它实际装的是 Bot-Test 受控验证那一整套（含与飞书无关的
# psycopg / cryptography），而正式的飞书目录适配器 `adapters/feishu_directory.py`
# 走裸 HTTP、根本不用 lark-oapi。旧名 `agent` 描述的是「依赖是什么」而不是
# 「谁需要它」，一并按进程改名。
#
# **`src/lingxi/` 里没有任何模块级第三方 import，全部是函数内延迟导入。**
# 因此「模块能 import 成功」证明不了依赖装上了——校验必须显式导入第三方模块本身，
# 见 scripts/ci/check_installed_package.py 的 `--process` 模式与 PROCESS_RUNTIME_IMPORTS。
[project.optional-dependencies]
# lingxi-scheduler 进程（`python -m lingxi.apps.scheduler`）。现在跑**三个**定时职责：
# 专用授权凭据续期扫描、九十天保留清理（#54）、花名册审计日报（#52）。
# 依据：
#   cryptography → adapters/delegated_credentials.py（Fernet 加密宿主机凭据文件）
#   psycopg      → adapters/delegated_credentials.py、retention.py、postgres_roster_audit.py
# **本组仍然不含 lark-oapi。** 同链上的 adapters/feishu_directory.py 与 #52 新增的
# adapters/feishu_group_message.py（管理群群发）都只用标准库 urllib——发消息走 SDK 会
# 为一个尚未接线的职责把整个 SDK 拉进常驻进程的依赖面。
# cryptography 精确锁版：Fernet 是宿主机凭据文件的安全边界，范围区间会让
# 依赖升级在代码未变时改变该边界（终轮 Codex）；升级须重跑凭据保管验证。
# scheduler 镜像也承载一次性 reauthorize job，因此显式带上 OAuth Bridge WebSocket
# 传输依赖；常驻 scheduler 本身仍不加载 OAuth Bridge 业务模块。
scheduler = [
    "cryptography==45.0.7",
    "psycopg[binary]>=3.2,<4",
    "websockets>=15,<16",
]
# 正式重授权是 scheduler 镜像里的独立一次性 job，但 #76 的干净环境门禁按进程
# 闭包逐项对账，因此保留同一依赖闭包的独立 extra 供 CI 验证；部署仍复用 scheduler
# 镜像，不额外构建第五个生产镜像。
reauthorize = ["cryptography==45.0.7", "psycopg[binary]>=3.2,<4", "websockets>=15,<16"]
# lingxi-worker 进程（`python -m lingxi.apps.worker`：turn/queue 两种受控执行模式）。
# 依据：入口 → queue service → PostgreSQL queue adapter，以及 Agent SDK session adapter。
# 精确锁版本，不用范围：执行层的只读边界建立在这个版本的 hook 事件名与工具名上
# （`PostToolUseFailure` 存在、子代理叫 `Agent` 不叫 `Task`、`HookMatcher` 的签名），
# 这些都是实测得到的、SDK 未作稳定性承诺的细节。升级前必须重跑 L4a，见
# docs/技术设计/验证与门禁.md 的 V-部署-08。
# 判定逻辑不依赖本组：`lingxi.core.execution` 的全部断言在无 SDK 环境即可跑，
# 绑定层的形状由桩模块锁住。CI 另有一步装上本组做真实冒烟（构造 `HookMatcher`，
# 不调模型、不用凭据），见 scripts/ci/check_agent_sdk_binding.py。
worker = ["claude-agent-sdk==0.2.128", "psycopg[binary]>=3.2,<4"]
# lingxi-gateway 进程（`python -m lingxi.apps.gateway`：飞书长连接接入、任务入队与
# 投递消费循环）。依据是从入口逐个追 import 链：
#   lark-oapi → adapters/feishu_longconn.py（ws.Client 建长连接）
#               adapters/feishu_outbound.py（加表情 message_reaction.create、
#               回文本 message.reply）
#               adapters/feishu_delivery.py（Issue #152：CardKit
#               cardkit.v1.card.create/update/settings、
#               cardkit.v1.card_element.content 流式更新、
#               投递文本兜底 im.v1.message.reply）
#   psycopg   → adapters/postgres_conversation/（会话、任务队列、入站事件幂等、
#               投递 outbox 消费记账）
#   websockets→ lark-oapi 的 ws 客户端实际用它建 wss（lark_oapi/ws/client.py:12
#               `import websockets`、:13 `from websockets.exceptions import
#               InvalidHandshake`）
# **websockets 显式声明，尽管 lark-oapi 会传递携带它。** 理由是独立复查已经证明
# extras 矩阵抓不到传递依赖缺失：矩阵装的是 `.[gateway]`，lark-oapi 把 websockets
# 带进来，于是"我们漏声明"这件事永远不会变红；一旦上游哪天把它挪出依赖表，
# 长连接会在部署时才失败。这一组**不含 cryptography**——gateway 不碰 Fernet，首次开通
# 编排（连同它的 MCP 令牌加解密）自 2026-08-18 裁定起住在 scheduler。
gateway = [
    "lark-oapi==1.7.1",
    "psycopg[binary]>=3.2,<4",
    "websockets>=15,<16",
]
# 2026-08-23 #146 清退：`bot-test` 组随 feishu_onboarding.py/refresh_tokens.py/
# postgres_onboarding.py 三个 Bot-Test 消费者一并删除——它们是这组里 lark-oapi、
# cryptography、psycopg 三项依赖唯一的存在理由。2026-08-24 #203 清退：曾经的保留件
# `adapters/oauth_bridge.py`（#67 裁定的 E1 授权基础设施参考实现）本身也已删除；
# 它此前唯一的传输依赖——本地 `oauth_bridge_client` 的 `websockets`——已由
# `scheduler`/`reauthorize` 两组声明覆盖，从一开始就不需要为它专设一组。详见代码
# 框架第五、六节。
# 数据库迁移（Issue #53）。**这一组不是常驻进程**，是部署时跑一次的迁移作业：
# `LINGXI_MIGRATION_DSN=... python -m alembic upgrade head`。它单独成组而不是挂进
# scheduler，有三个理由：
#   1. 迁移要 DDL 权限、业务进程不要，两者本就该是不同的数据库角色；
#   2. `src/lingxi/` 里不得出现 sqlalchemy / alembic（断言 V-迁移-04），把它塞进
#      某个进程组等于声称那个进程运行时需要它，是假的；
#   3. 生产镜像因此不必为了跑业务而装上 SQLAlchemy。
# 窄区间而不是 `==`：按 2026-08-06 裁定①，alembic 属迁移工具链，不在运行时进程内，
# 不是 V-部署-08 所说的"安全边界组件"。上界不能省——alembic 的 revision 解析与
# 事务语义是次版本可变的，开区间等于允许它在代码没变时改变迁移行为。
#
# **psycopg 必须显式列在这里。** alembic 不依赖任何数据库驱动，驱动由 URL 的 scheme
# 决定；env.py 强制 `postgresql+psycopg`，所以这一组不带 psycopg 就根本连不上库
# （外审实测：干净环境跑 upgrade 报 `ModuleNotFoundError: No module named 'psycopg'`）。
# 此前 gate 是绿的，因为它同时装了 scheduler 组，把驱动顺带带了进来——正是「别的组
# 带进来的包让窄的那组永远不会红」这一类缺陷。区间与 scheduler 组同款。
# 传递依赖（`pip install '.[migrate]'` 实测闭包，五项）：SQLAlchemy、Mako、MarkupSafe、
# greenlet、typing-extensions。psycopg-binary 不在此列，它来自上面 `psycopg[binary]`
# 的直接声明。这份清单在 docs/技术设计/代码框架.md 与 migrations/README.md 各有一份，
# 三处必须一致。
migrate = ["alembic>=1.19,<1.20", "psycopg[binary]>=3.2,<4"]

# 角色职能映射是随包发布的配置文件，不是源码。不显式声明就不会进 wheel，
# 而缺失表现为「全部角色显示未映射」——一种看起来正常的失败。
# CI 的 scripts/ci/check_installed_package.py 校验它确实在已安装的制品里。
[tool.setuptools.package-data]
"lingxi.config" = ["*.toml"]

[tool.unittest]
start-directory = "tests"
