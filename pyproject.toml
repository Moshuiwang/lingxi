[project]
name = "lingxi"
version = "0.1.0"
description = "Lingxi 企业内部受控 AI 业务分析服务"
requires-python = ">=3.12"

[project.optional-dependencies]
feishu = ["cryptography>=42,<46", "lark-oapi==1.7.1", "psycopg[binary]>=3.2,<4", "websockets>=15,<16"]
# 精确锁版本，不用范围：执行层的只读边界建立在这个版本的 hook 事件名与工具名上
# （`PostToolUseFailure` 存在、子代理叫 `Agent` 不叫 `Task`、`HookMatcher` 的签名），
# 这些都是实测得到的、SDK 未作稳定性承诺的细节。升级前必须重跑 L4a，见
# docs/技术设计/验证与门禁.md 的 V-部署-08。
# CI 不安装本组：判定逻辑不依赖 SDK，绑定层用桩模块验证形状。
agent = ["claude-agent-sdk==0.2.128"]

[tool.unittest]
start-directory = "tests"
