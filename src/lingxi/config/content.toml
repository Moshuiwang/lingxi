# 5434086490；Issue #407 增粒度，产品负责人 2026-08-29 方向 A+B 裁定）：长问数
# 期间在这些句子之间切换，覆盖两次真实执行信号之间卡片文字长时间不变的问题；
# 30 秒仍无新信号则由兜底计时强制刷新一次纯用时更新（沿用当前这句文案，只跳动
# worker.status 的 elapsed_seconds）。三大类：问数查询工具（细分四个已知子步骤，
# 见下方 querying_* 四条与 core/execution/card_stream.py 的白名单式映射表
# `_QUERY_STEP_ACTION_TEXT_KEYS`）、模型文本输出（composing）、其它工具调用
