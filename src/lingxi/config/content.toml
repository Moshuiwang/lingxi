# Issue #341 S-ES-3：文档投递独立消费循环成功建档、写正文、授予可管理并读回
# 确认后，作为一条追加消息发给提问用户（不进入任何已有话题的卡片/文本终态，
# 见 apps/gateway/document_delivery.py 模块说明）。{url} 是纯本地拼接的文档
# 链接，不含用户数据或凭据。
"delivery.document_ready" = "你要的文档已生成：{url}（你已获得可管理权限）"
# opus 审查 R-1 第 3 条：此前 mark_failed/mark_uncertain 只落终态与日志/告警，
# 提出文档请求的用户本人从未收到任何消息——表现成"点了要文档，然后再也没有
# 下文"。与 delivery.document_ready 同一条出站信道（追加消息，不进入任何已有
# 话题终态），成功/失败/结果不明三种终态现在各自都有对应的用户可见文案。
"delivery.document_failed" = "抱歉，你要的文档生成失败了。你可以重新发起问数再试一次；问题已记录。"
# uncertain 与 failed 措辞刻意区分（V-交付-03：结果不明不自动重发，转人工核对，
# 不是"确定失败、你可以重试"——重试可能造成重复建档/重复授权，见
# apps/gateway/document_delivery.py 模块说明「白名单反转」）。
"delivery.document_uncertain" = "文档生成结果暂无法确认，已转人工核对。"

# Issue #354 S-H3-2：表格分支，与 delivery.document_ready/failed/uncertain 基本
# 对称（同一条出站信道、同一失败关闭姿态），唯一差异是"文档"改成"表格"。{url}
# 是建表响应直接返回、落检查点的表格链接（见 adapters/feishu_sheets_delivery.py
# 模块文档「与文档交付的差异点」第 1 条），不含用户数据或凭据。
"delivery.sheet_ready" = "你要的表格已生成：{url}（你已获得可管理权限）"
# S-H3-2 卡片明确要求失败/结果不明文案携带追溯号（姿态照 Issue #280 裁定
# B2-4：占位名不能叫 trace_id，用 {reference} 代替）——docx 分支的两条对应文案
# （delivery.document_failed/uncertain）先于 #280 落地，暂不追加改写（不改
# docx 既有行为，见 S-H3-2 卡边界）；表格分支从今天起按现行姿态实现，两者的
# 差异是历史先后，不是产品对两种产物的差别对待。{reference} 取值是这次交付
