# 「指标中文别名」→ 真实指标 ID 映射（Issue #439 A 档：文本命令兜底人性化）
#
# 背景：真实指标目录（config/company_function_metric_map.toml）里的指标 ID 全部是
# 英文 snake_case 内部标识（如 "sub_new_count"），管理员在 /admin revoke_permission
# 里目前必须精确输入这个 ID 才能命中——记不住拼写、把参数形状搞混，是 #439 卡内登记的
# 两次真实误用之一。（``/admin grant_permission`` 与 ``/admin suppress_permission``
# 已按 Trace #544 D-5 撤除，别名反查因此只剩收回这一个文本命令的使用者。）
#
# 本文件只提供「别名 → 真实指标 ID」的查找表，供 adapters/admin_metric_alias_map_file.py
# 加载、core/admin/router.py 在收回写命令里查一次（查不到就原样
# 透传输入，交给下游按既有"未找到"语义处理，不新增并行的错误分支——见 router.py 的
# ``AdminQueries.resolve_metric_name`` 文档）。本文件不校验别名是否已在别处使用，也不
# 校验右值是否真的出现在 company_function_metric_map.toml 里——两个文件由不同人分别
# 维护，互相校验会让改一个文件牵连另一个文件的解析（与 metric_translation.py 对
# galaxy_role_function_map.toml 的既有取舍一致）。
#
# ── 当前状态：内容已由产品负责人填入（2026-08-30，Trace #469 S-1 PM 补充裁定）──
# 下面九条别名与真实指标 ID 的对应关系由产品负责人逐条裁定给出，编排者机械落盘，
# 不做任何猜测或反推。同一份映射同时供 core/admin/router.py 的
# ``AdminQueries.resolve_metric_name``（输入侧：文本命令允许直接打中文别名）与
# ``core/admin/display_names.AdminDisplayNames.metric_label`` 的真实实现（展示
# 侧：管理卡下拉选项、确认卡/终态卡/群通知的「指标」字段一律显示这份别名，不
# 再显示 "sub_new_count" 这类内部 snake_case ID）反查使用——见两个模块各自的
# 文档。
#
# ── 生效时机 ─────────────────────────────────────────────────────────
# 与 galaxy_role_function_map.toml/company_function_metric_map.toml（scheduler 进程
# 启动时读一次）不同，本文件由 gateway 在**每次**收到 grant/suppress/revoke 写命令时
# 现读（见 adapters/admin_metric_alias_map_file.py 模块文档）——管理命令面是低频的
# 单管理员交互，现读的文件 I/O 成本可忽略，换来的是编辑本文件后**立即**生效、不需要
# 重启 gateway 容器。
#
# ── 形状 ─────────────────────────────────────────────────────────────
# [aliases]
# "别名文本" = "真实指标ID"

[aliases]
"新增订户数" = "sub_new_count"
"充值订户数" = "sub_recharge_count"
"充值金额" = "sub_recharge_money"
"扣费订户数" = "sub_deduction_count"
"扣费金额" = "sub_deduction_money"
"渠道市场份额" = "channel_market_sharing"
"渠道费率" = "channel_rate"
"汇率" = "exchange_rate"
"增值税率" = "vat_rate"
