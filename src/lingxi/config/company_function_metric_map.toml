# 「公司 + 职能」→「问数 MCP 指标名列表」翻译映射
#
# 依据：Issue #227（载体先行，内容后填）。这一层的作用是把 Lingxi 内部的职能标签
# （见 galaxy_role_function_map.toml 的右值，例如「运营」「财务」）翻译成问数 MCP
# 认识的指标名（例如「日活」「收入」），供 core/permission/publish_row.py 的
# serialize_translated_permissions 写进权限发布表的 permissions 列。
#
# ── 这个文件当前是什么状态 ────────────────────────────────────────────
# **当前是空的**：下面 [companies] 表存在，但没有任何条目。这是本 Story 交付时的
# 正常状态，不是缺陷——映射内容只有产品负责人能给（哪个公司的哪个职能对应哪些指标
# 名），代码这一侧只负责把内容后填的路铺好。
#
# 空映射的效果：core/permission/metric_translation.py 的 translate_company_functions
# 对任何一个「公司 + 职能」组合都查不到，因此**每一个原本有效授权的用户在翻译这一步
# 都会失败关闭**——这是刻意的：在真实映射内容到位之前，不会有任何权限内容被翻译成
# 「看起来像指标名」的文本发布出去，维持的是与「值列表仍是职能标签时不得真实发布」
# 完全一样的效果，只是失败发生的位置换成了显式的翻译层，而不是隐式的"没人接令牌"。
#
# ── 怎么维护（产品负责人填写时看这里）────────────────────────────────
# 1. 在 [companies] 下面按「公司 → 职能 → 指标名列表」三层加条目：
#
#      [companies."<公司ID>"]
#      "<职能标签>" = ["<指标名1>", "<指标名2>", ...]
#
#    - "<公司ID>" 是 sys_country.boss_company_id 的原始取值（与发布表 permissions
#      列的键、以及向问数 MCP 申请权限用的键同一个字符串，一字不差）；持有「全非」
#      通配（所有公司）的人用字面量 "*" 作为公司键，不要把 "*" 展开成具体公司 ID
#      列一遍——展开是我们这一侧的解释，翻译层不替这件事做主。
#    - "<职能标签>" 必须与 galaxy_role_function_map.toml 右值**完全一致**（精确
#      匹配，不是同义词、不做大小写或全半角折叠）。
#    - "<指标名>" 是问数 MCP 认识的指标名，**逐字符原样透传到发布表**：大小写、
#      全角半角、空白全部算数，一个字符都不能凭直觉改。指标名列表不能是空列表——
#      一个职能如果在某公司下确实没有对应指标，就不要给这个公司写这个职能的条目
#      （不覆盖 = 翻译层 fail-closed 拒绝，而不是"这个人在这个公司没有这项指标"，
#      两者语义不同，因此空列表在这里不合法）。
#
# 2. 同一个公司下允许有多个职能条目；同一个职能在不同公司下允许对应不同的指标名
#    列表（这正是「公司 + 职能」联合键存在的原因——同一个职能在不同公司可能有不同
#    的指标口径）。
#
# 3. 未被本文件覆盖的「公司 + 职能」组合，翻译层会 fail-closed（既不猜测、也不回落
#    成职能标签本身、也不静默丢弃只发布覆盖到的那部分）——运维会在每日权限重算的
#    审计里看到 metric_translation_uncovered 计数。这不是 bug，是本文件还没填全。
#
# 4. 不要把含真实公司业务信息或真实指标口径细节之外的任何人员数据写进来——本文件在
#    仓库里，属于公开正文。改完直接提交即可，无需改代码；
#    tests/test_permission_metric_translation.py 与
#    tests/test_company_function_metric_map_file.py 会校验文件能被解析。
#
# 格式为 TOML，由 Python 标准库 tomllib 解析，不引入任何新依赖。
#
# ── 示例（非真实数据，仅用于说明格式；不要直接照抄）───────────────────
# 下面几行整体注释掉，公司 ID、职能标签与指标名全部是虚构占位，不对应任何真实公司、
# 真实人员或真实指标：
#
# [companies."9001"]
# "运营" = ["示例指标-日活", "示例指标-收入"]
# "财务" = ["示例指标-收入"]
#
# [companies."*"]
# "CEO" = ["示例指标-日活", "示例指标-收入", "示例指标-OTT活跃"]

