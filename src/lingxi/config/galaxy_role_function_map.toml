# 银河角色名 → Lingxi 职能标签映射
#
# 依据：Issue #17 中产品负责人 2026-08-05 的决策 2——
# 「所有 A 打头的角色字段，比如 A运营=我们系统里的运营，A销售=我们系统销售，
#   将这份规则抽象出来作为配置文件，后期持续维护。」
#
# ── 这个文件是做什么的 ────────────────────────────────────────────────
# 银河的角色名是自由文本（实测 74 个，命名规则不统一，含临时角色与个人专用角色）。
# Lingxi 不猜测它们的含义：只有写在下面 [roles] 里的角色名才会得到职能标签，
# 没写的一律保留原角色名并标记「未映射」。
#
# 映射只影响**展示与人工核对时的职能标签**，不改动银河落库的原始数据，
# 也不改变任何人的实际权限。
#
# ── 怎么维护 ──────────────────────────────────────────────────────────
# 1. 在 [roles] 下面加一行：  "银河里的角色名" = "Lingxi 的职能"
#    左边必须与银河导出中的角色名**完全一致**（只忽略首尾空白，不忽略括号、
#    空格、全半角差异）；右边是给人看的职能名称。
# 2. 一行一个角色，不要写通配符或前缀规则——实现不支持，也刻意不支持：
#    「去掉开头的 A」在真实角色名里会误伤（例如以 A 开头的英文角色名）。
# 3. 改完直接提交本文件即可，无需改代码；`tests/test_galaxy_role_function.py`
#    会校验文件能被解析。
# 4. 不要把含真实人名的个人专用角色写进来——本文件在仓库里，属于公开正文。
#
# 格式为 TOML，由 Python 标准库 tomllib 解析，不引入任何新依赖。

[meta]
# 决策来源与最后一次由产品负责人确认的时间，改动规则时一并更新。
decision = "Issue #17 / 2026-08-05 产品负责人决策 2"
last_reviewed = "2026-08-05"

[roles]
# 目前只登记产品负责人明确给出的两条规则。其余 A 前缀角色待逐条确认后追加，
# 在此之前它们在 Lingxi 里显示为「未映射」，这是刻意的。
"A运营" = "运营"
"A销售" = "销售"
