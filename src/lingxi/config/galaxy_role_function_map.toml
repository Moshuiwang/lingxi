# 银河角色名 → Lingxi 职能标签映射
#
# 依据：Issue #17 中产品负责人 2026-08-05、2026-08-08 的决定——
# 「所有 A 打头的角色字段抽象成配置文件，后期持续维护。」
#
# ── 这个文件是做什么的 ────────────────────────────────────────────────
# 银河的角色名是自由文本（命名规则不统一，含临时角色与个人专用角色）。
# Lingxi 不猜测它们的含义：只有写在下面 [roles] 里的角色名才会得到职能标签，
# 没写的一律标记为「未映射」、不产生 Lingxi 支持职能；用户没有任何命中的支持职能时按「未授权」处理。
#
# 当前明确不支持的角色包括所有 APP 开头角色，以及「A海外本地员工营业厅」。
# 这些角色不写入 [roles]；用户若同时拥有其他受支持角色，只按受支持角色计算范围。
#
# 映射用于**展示和授权资格判断**，不改动银河落库的原始数据，也不自行扩大任何人的
# 实际权限；最终实际可查询范围仍由 MCP 按已同步权限决定。
#
# ── 怎么维护 ──────────────────────────────────────────────────────────
# 1. 在 [roles] 下面加一行：  "银河里的角色名" = "Lingxi 的职能"
#    左边必须与银河导出中的角色名**完全一致**（只忽略首尾空白，不忽略括号、
#    空格、全半角差异）；右边是给人看的职能名称。
# 2. 一行一个角色，不要写通配符或前缀规则——实现不支持，也刻意不支持：
#    「去掉开头的 A」在真实角色名里会误伤（例如 APP 角色和以 A 开头的英文角色名）。
#    目前角色规则中的“含 OTT”优先于“含运营”，因此 A运营_OTT* 映射为 OTT。
# 3. 改完直接提交本文件即可，无需改代码；`tests/test_galaxy_role_function.py`
#    会校验文件能被解析。
# 4. 不要把含真实人名的个人专用角色写进来——本文件在仓库里，属于公开正文。
#
# 格式为 TOML，由 Python 标准库 tomllib 解析，不引入任何新依赖。

[meta]
# 决策来源与最后一次由产品负责人确认的时间，改动规则时一并更新。
decision = "Issue #17 / 2026-08-08 产品负责人补充确认"
last_reviewed = "2026-08-08"

