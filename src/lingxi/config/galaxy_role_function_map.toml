# 银河角色名 → Lingxi 职能标签映射
#
# 依据：Issue #17 中产品负责人 2026-08-05、2026-08-08 的决定——
# 「所有 A 打头的角色字段抽象成配置文件，后期持续维护。」
#
# ── 这个文件是做什么的 ────────────────────────────────────────────────
# 银河的角色名是自由文本（命名规则不统一，含临时角色与个人专用角色）。
# Lingxi 不猜测它们的含义：只有写在下面 [roles] 里的角色名才会得到职能标签，
# 没写的一律标记为「未映射」、不产生 Lingxi 支持职能；用户没有任何命中的支持职能时按「未授权」处理。
#
# 当前明确不支持的角色包括所有 APP 开头角色，以及「A海外本地员工营业厅」。
# 这些角色不写入 [roles]；用户若同时拥有其他受支持角色，只按受支持角色计算范围。
#
# 映射用于**展示和授权资格判断**，不改动银河落库的原始数据，也不自行扩大任何人的
# 实际权限；最终实际可查询范围仍由 MCP 按已同步权限决定。
#
# ── 怎么维护 ──────────────────────────────────────────────────────────
# 1. 在 [roles] 下面加一行：  "银河里的角色名" = "Lingxi 的职能"
#    左边必须与银河导出中的角色名**完全一致**（只忽略首尾空白，不忽略括号、
#    空格、全半角差异）；右边是给人看的职能名称。
# 2. 一行一个角色，不要写通配符或前缀规则——实现不支持，也刻意不支持：
#    「去掉开头的 A」在真实角色名里会误伤（例如 APP 角色和以 A 开头的英文角色名）。
#    目前角色规则中的“含 OTT”优先于“含运营”，因此 A运营_OTT* 映射为 OTT。
# 3. 改完直接提交本文件即可，无需改代码；`tests/test_galaxy_role_function.py`
#    会校验文件能被解析。
# 4. 不要把含真实人名的个人专用角色写进来——本文件在仓库里，属于公开正文。
#
# 格式为 TOML，由 Python 标准库 tomllib 解析，不引入任何新依赖。
#
# ── 「后台管理员」为什么是独立职能，不并进已有七个职能之一（Issue #320）──────
# 银河「后台管理员」角色（role_id 513）此前完全没有职能映射，导致持有该角色的用户
# （且仅持有该角色，无其他业务角色）开通被拒——产品负责人 2026-08-26 裁定「银河
# 管理员理论上所有指标都可以看，是我忘了建这条通道」，并明确这是「全公司 × 全指标」
# （`*×*`）。这里把它映射成一个**独立**的职能标签「后台管理员」，而不是复用
# 「CEO」或「运营」（两者当前恰好也是「全部指标」）：复用会让「后台管理员」的授予面
# 意外跟随 CEO/运营未来的内容调整而漂移，两者概念上不是同一件事，独立标签让
# `company_function_metric_map.toml` 里这条决定可以单独审计、单独修订。
#
# [meta] 的 last_reviewed 保留 2026-08-08（七个业务职能那批决定的时间）不动：
# 「后台管理员」是本次单独新增的一条，不是对那批决定的修订。

[meta]
# 决策来源与最后一次由产品负责人确认的时间，改动规则时一并更新。
decision = "Issue #17 / 2026-08-08 产品负责人补充确认"
last_reviewed = "2026-08-08"

[roles]
# 「后台管理员」（role_id 513，Issue #320，产品负责人 2026-08-26 裁定）：全公司×全指标，
# 见上方「为什么是独立职能」一节；指标内容在 config/company_function_metric_map.toml，
# 与其余七个职能同一套「每个公司键都写满」的展开规则（含 [companies."*"]）——同一条
# 理由：银河实际授予这个人的公司范围可能是「全非」通配，也可能是具体公司枚举，
# 两种情况都不该在翻译层 fail-closed，见该文件「为什么每家公司都列了全部职能」。
"后台管理员" = "后台管理员"
"A商务" = "商务"
"A海外CEO门户" = "CEO"
"A海外收视率样本户" = "内容"
"A海外本地员工收视率报表" = "内容"
"A财务" = "财务"
"A财务-折扣" = "财务"
"A运营" = "运营"
"A运营_CEO" = "运营"
"A运营_DTTDTH" = "运营"
"A运营_万村通" = "运营"
"A运营_呼叫中心" = "运营"
"A运营（所有）" = "运营"
"A运营_OTT专岗" = "OTT"
"A运营_OTT运营分析" = "OTT"
"A销售" = "销售"
"A销售_三级销售体系" = "销售"
"A销售_中文包" = "销售"
"A销售_渠道分析（海外）" = "销售"
"A销售_电视机" = "销售"
"A销售（所有）" = "销售"
