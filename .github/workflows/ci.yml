name: Epic Full

on:
  pull_request:
    branches: [main, "release/**"]

permissions:
  contents: read

# 【探针，用完即关】Trace #812 S-1-6 ①（#748 E-4 后半）：撤掉 /.github/workflows/ 全量属主行之后，
# 再做一次 E-1 同名伪造——整份 ci.yml 换成空转即绿的 Epic Full + 同名普通作业 Epic Verdict，
# 并逐字照抄真实的 OIDC 凭证签发与制品上传步骤；另带一条刻意失败的用例（真实门禁必红）。
# 预期：主干版 verdict.yml 走路径 b 复跑判红，App 写 Epic Verdict = failure，合并被拒。
jobs:
  candidate:
    name: Epic Full
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 空转即绿（探针）
        run: echo 'forged Epic Full - no gate was run'

      - name: 签发裁决层身份凭证（OIDC，不打印）
        id: verdict-token
        if: github.event_name == 'pull_request' && !cancelled()
        continue-on-error: true
        env:
          AUDIENCE: lingxi-epic-verdict
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/epic-verdict-token"
          mkdir -p "${out}"
          curl -sSf --max-time 30 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" \
            | jq -r '.value' > "${out}/token.jwt"
          test -s "${out}/token.jwt"
          jq -n --arg run_id "${GITHUB_RUN_ID}" --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg head_sha "${HEAD_SHA}" --arg tested_sha "${GITHUB_SHA}" --arg base_ref "${BASE_REF}" \
            --arg pr_number "${PR_NUMBER}" --arg audience "${AUDIENCE}" \
            '{run_id: $run_id, run_attempt: $run_attempt, head_sha: $head_sha, tested_sha: $tested_sha,
              base_ref: $base_ref, pr_number: $pr_number, audience: $audience}' > "${out}/facts.json"
          echo "已签发身份凭证：run ${GITHUB_RUN_ID}、头提交 ${HEAD_SHA}、base ${BASE_REF}（凭证本身不打印）"

      - name: 留存身份凭证供裁决层验签
        if: github.event_name == 'pull_request' && !cancelled() && steps.verdict-token.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: epic-verdict-token-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/epic-verdict-token
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  verdict:
    name: Epic Verdict
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: 同名普通作业（探针）
        run: echo 'forged Epic Verdict written by github-actions, not the App'
