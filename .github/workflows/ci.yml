name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: CI / gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: lingxi_test
        options: >-
          --health-cmd "pg_isready -U postgres -d lingxi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 配置 Worker 校验运行时
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/oauth-bridge/package-lock.json

      - name: 校验 OAuth Worker
        working-directory: workers/oauth-bridge
        run: |
          npm ci
          npm test
          npm run check

      - name: 运行基础质量门禁
        env:
          LINGXI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: scripts/ci/verify_repository.sh
