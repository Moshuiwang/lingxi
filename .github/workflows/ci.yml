name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    # Issue #43 瘦身（A2）：合并后或直推 main 的推送只对代码路径重跑完整门禁；
    # 纯文档推送由 docs.yml 轻量覆盖。PR 阶段不做路径过滤，始终运行完整门禁。
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'workers/**'
      - 'migrations/**'
      - 'experiments/**'
      - 'pyproject.toml'
      # Issue #53：alembic 配置在仓库根目录，不在上面任何一个目录里。漏掉它，
      # 「改坏迁移配置直推 main」这一路就不会触发完整门禁。
      - 'alembic.ini'
      # Issue #62：部署编排同型。Dockerfile 与 .dockerignore 在仓库根目录，
      # deploy/ 是新增顶层目录——三者都不在上面任何一条路径里，漏掉就等于
      # 「改坏镜像构建或 compose 直推 main」不触发完整门禁。
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: CI / gate
    runs-on: ubuntu-24.04
    # 本机实测 Python 测试步骤 350s（≈5.8 分钟，679 条，含真库），已超原先的 5 分钟；
    # 而 runner 的波动系数实测可达 3 倍以上——#53 有过一次 90s 量级的工作被拖到 5 分钟
    # 触顶被杀（见 26e9973 的重触发说明）。10 分钟吸收绝大多数波动。
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: lingxi_test
        # 凭据测试经 TCP 连接 localhost:5432，必须把服务端口发布到 runner；
        # 只用 docker exec 的表结构测试不依赖它。
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lingxi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 配置 Worker 校验运行时
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/oauth-bridge/package-lock.json

      - name: 校验 OAuth Worker
        working-directory: workers/oauth-bridge
        run: |
          npm ci
          npm test
          npm run check

      # 此前没有这一步：门禁跑在 runner 镜像碰巧自带的 python3 上。
      # ubuntu-24.04 恰好是 3.12，所以一直没暴露，但那是巧合不是声明。
      - name: 配置 Python 运行时
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # 固定小版本而不是读 pyproject 的 ">=3.12"：后者是开区间，新 Python
          # 发布时门禁会自己跳版本。脚本里另有一道校验，确保这里不低于 pyproject
          # 声明的下限，两边漂移会被发现。
          python-version: '3.12'
          # Issue #43 瘦身（A3）：缓存 pip 下载目录（scheduler / worker extras，
          # 含 claude-agent-sdk 轮子），缓存键取自 pyproject.toml 的哈希。
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      # shellcheck 此前用的是 runner 镜像自带的版本，既没锁定也没打印：同一个提交
      # 可能因为镜像更新得到不同结论。改用 pip 分发并锁版本，本机可装同一个。
      # 装 scheduler 组而不是全量：单测跑完只需要 cryptography 与 psycopg，
      # 不需要 lark-oapi / websockets（两者都只在函数内延迟导入，测试从不走到）。
      # Bot-Test 那一组的依赖由 `CI / extras` 矩阵在干净环境里单独证明装得上。
      # 追加 migrate 组（Issue #53）：门禁的两处迁移检查真的执行 alembic——
      # scripts/ci/check_alembic_revisions.py（建 revision 图，无需数据库）与
      # scripts/ci/check_migration_chain.sh（两条链建库对比）。不装它，这两步会
      # 明确失败而不是跳过，所以这一行就是 alembic 在 CI 里的安装点。
      - name: 安装测试依赖与锁定版本的 shellcheck
        run: python3 -m pip install '.[scheduler,migrate]' 'shellcheck-py==0.11.0.1'

      # 测试跑 PYTHONPATH=src，部署跑 pip 装出来的制品；新增子目录会让两者分叉，
      # 而分叉只在部署时才暴露。必须在仓库目录之外跑，否则只是又测了一遍源码树。
      - name: 校验已安装的包完整
        working-directory: ${{ runner.temp }}
        run: python3 "${GITHUB_WORKSPACE}/scripts/ci/check_installed_package.py"

      # 桩模块只能证明本侧形状没变，证明不了真实 SDK 装得上、HookMatcher 签名兼容。
      # 这一步不调用模型、不使用任何业务凭据，只构造 hooks 配置。
      - name: 真实 Agent SDK 冒烟（不调模型、不用凭据）
        run: |
          python3 -m pip install '.[worker]'
          python3 "${GITHUB_WORKSPACE}/scripts/ci/check_agent_sdk_binding.py"

      - name: 运行基础质量门禁
        env:
          LINGXI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          LINGXI_POSTGRES_DSN: postgresql://postgres@localhost:5432/lingxi_test
        run: scripts/ci/verify_repository.sh

      # 安装与测试都在检出目录里跑。生成物已被 .gitignore 覆盖，但受版本控制的
      # 文件若被改写，此前不会有任何人发现——CI 仍会全绿。
      - name: 校验 CI 没有改写受版本控制的文件
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo 'CI 过程改写了工作树：' >&2
            git status --porcelain >&2
            exit 1
          fi
          echo '工作树洁净：CI 未改写受版本控制的文件'

  # Issue #56：extras 按进程拆分之后，每个组都要被证明「单独装得上、且该进程的运行
  # 依赖真的齐」。必须一组一个**干净虚拟环境**：装在同一个环境里累加，narrower 的组
  # 会白白用上别组带进来的包，检查就永远不会红。
  #
  # gate 里的 `check_installed_package.py`（不带 --process）抓不到这类缺陷：
  # `src/lingxi/` 没有任何模块级第三方 import，缺 psycopg 时全部模块照样 import 成功。
  # 实测对照——把 psycopg 从 scheduler 组删掉后，不带 --process 的检查仍然退出 0，
  # 带 --process 的退出 1。
  extras:
    name: CI / extras (${{ matrix.extra }})
    runs-on: ubuntu-24.04
    # 同一次波动里 bot-test 腿也曾 5 分钟触顶；migrate 腿在争抢下实测过 4m32s。
    # 每条腿只做「干净环境装一个 extra + 导入校验」，8 分钟足够且仍能挡住真正的挂死。
    timeout-minutes: 8
    strategy:
      # 各组互相独立，一组坏了也要看到其余组的结论。
      fail-fast: false
      matrix:
        # 与 pyproject.toml 的 [project.optional-dependencies] 组名保持一致；
        # 新增 extra 时必须同步加进这里，否则新组没有任何检查覆盖。
        # check_installed_package.py 会三方对账（pyproject / 本矩阵 / 脚本），漏加即红。
        # migrate 是部署时跑一次的迁移作业，不是常驻进程，但同样要证明"单独装得上"：
        # #62 要为它构建镜像，那时缺依赖就是部署当场失败（Issue #53）。
        extra: [scheduler, worker, gateway, bot-test, migrate]

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 配置 Python 运行时
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # 与 gate 同一版本；此处不开 pip 缓存，三条矩阵腿的缓存键相同会互相抢占，
          # 而这几个组都是小轮子，省下的时间不值那份噪声。
          python-version: '3.12'

      - name: 在干净虚拟环境里只装这一个 extra
        env:
          EXTRA: ${{ matrix.extra }}
          VENV: ${{ runner.temp }}/venv
        run: |
          python3 -m venv "${VENV}"
          "${VENV}/bin/python" -m pip install ".[${EXTRA}]"
          echo "--- 该环境实际装了什么 ---"
          "${VENV}/bin/python" -m pip list

      # 与 gate 同理，必须在仓库目录之外跑，否则只是又测了一遍源码树。
      - name: 校验制品完整与该进程的运行依赖
        working-directory: ${{ runner.temp }}
        env:
          EXTRA: ${{ matrix.extra }}
          VENV: ${{ runner.temp }}/venv
        run: |
          "${VENV}/bin/python" "${GITHUB_WORKSPACE}/scripts/ci/check_installed_package.py" --process "${EXTRA}"

  # Issue #62：镜像构建与部署门禁。
  #
  # **与 gate 并行、互不阻塞**：gate 是 5 分钟的快门禁，本 job 要构建三个镜像并且
  # 每个都构建两次（可复现性判定），慢得多。把它塞进 gate 会让每一次纯代码改动都等
  # 二十分钟；拆开之后，改代码的人照常在 5 分钟内拿到 gate 结论。
  #
  # 刻意**不使用矩阵**：本 job 的多数断言是**跨镜像**的（scheduler 与 worker 里都不许
  # 有 lark-oapi、三个镜像共用同一份 check_installed_package.py 对账），拆成矩阵反而
  # 要把镜像在 job 之间搬来搬去（三个加起来约 1.1 GB）。顺带也就不存在"新增矩阵用了
  # `extra:` 作键、污染 check_installed_package.py 的三方对账正则"这个坑——
  # scripts/ci/check_deploy_contract.py 仍然断言 ci.yml 里 `extra: [...]` 恰好一行。
  image:
    name: CI / image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # M2-62-32：`packages: write` **只在本 job 声明**。workflow 级保持 contents: read，
    # gate 与 extras 不因为本 job 需要推镜像而跟着提权。
    permissions:
      contents: read
      packages: write

    steps:
      # 两份检出，**两个不同长度的绝对路径**。可复现性判定要求"同一提交、两个不同
      # 绝对路径的干净 clone 各构建一次"结果零差异；路径长度也故意不同，
      # 这样任何把构建目录写进产物的行为（.pyc 的 co_filename 是最常见的一种）
      # 都会表现为长度不同的字符串，而不是碰巧对齐。
      - name: 检出代码（构建 A）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: build-a

      - name: 检出代码（构建 B，路径刻意更长）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: build-b-second-independent-checkout

      - name: 计算不可变 tag
        id: tag
        run: |
          batch=$(date -u +%Y%m%d)
          short=$(echo "${GITHUB_SHA}" | cut -c1-12)
          echo "batch=${batch}" >> "${GITHUB_OUTPUT}"
          echo "tag=${batch}-${short}" >> "${GITHUB_OUTPUT}"
          echo "不可变 tag：${batch}-${short}"

      - name: 构建三个镜像（构建 A）
        working-directory: build-a
        env:
          LINGXI_IMAGE_BATCH: ${{ steps.tag.outputs.batch }}
          LINGXI_IMAGE_COMMIT: ${{ github.sha }}
        run: |
          for service in scheduler migrate worker; do
            LINGXI_IMAGE_REFERENCE_FILE="${RUNNER_TEMP}/reference-${service}" \
              scripts/ci/build_image.sh "${service}" --no-cache
            docker tag "$(cat "${RUNNER_TEMP}/reference-${service}")" "lingxi-${service}:build-a"
          done

      - name: 构建三个镜像（构建 B，独立目录、冷缓存）
        working-directory: build-b-second-independent-checkout
        run: |
          for service in scheduler migrate worker; do
            docker build --no-cache --target "${service}" -t "lingxi-${service}:build-b" .
          done

      # 断言 V-部署-06 / M2-62-05：**内容级**等价，不是 manifest digest 相等。
      # 镜像配置里有 created 时间戳，所以同一份 rootfs 每次构建的 digest 必然不同；
      # 拿 digest 当判据只会得到"永远不等价"这个无用结论。
      - name: 两次构建产物等价（内容级）
        working-directory: build-a
        run: |
          status=0
          for service in scheduler migrate worker; do
            python3 scripts/ci/image_manifest.py "lingxi-${service}:build-a" --output "/tmp/${service}-a.txt"
            python3 scripts/ci/image_manifest.py "lingxi-${service}:build-b" --output "/tmp/${service}-b.txt"
            if diff -u "/tmp/${service}-a.txt" "/tmp/${service}-b.txt" > "/tmp/${service}.diff"; then
              echo "${service}：两次构建内容清单零差异"
            else
              echo "${service}：两次构建内容不等价" >&2
              head -50 "/tmp/${service}.diff" >&2
              status=1
            fi
            docker inspect --format '{{json .Config}}' "lingxi-${service}:build-a" > "/tmp/${service}-cfg-a.json"
            docker inspect --format '{{json .Config}}' "lingxi-${service}:build-b" > "/tmp/${service}-cfg-b.json"
            if ! diff -u "/tmp/${service}-cfg-a.json" "/tmp/${service}-cfg-b.json"; then
              echo "${service}：.Config 不一致" >&2
              status=1
            fi
          done
          exit "${status}"

      - name: 镜像部署契约逐条核对
        working-directory: build-a
        run: |
          scripts/ci/verify_image_contract.sh \
            lingxi-scheduler:build-a lingxi-worker:build-a lingxi-migrate:build-a

      # 断言 V-部署-05 的本地演法（编排者裁定①）：真库升到 head，追加一条合成的
      # 前滚迁移，再用**迁移前构建的镜像**启动 scheduler 跑完一轮并优雅退出。
      - name: 旧镜像在新库结构上启动（V-部署-05）
        working-directory: build-a
        run: scripts/ci/verify_old_image_new_schema.sh lingxi-scheduler:build-a lingxi-migrate:build-a

      # stage 与生产 compose 必须结构相同、只有配置不同（M2-62-13）。
      - name: Compose 结构对照（stage ↔ 生产）
        working-directory: build-a
        run: scripts/ci/verify_compose_structure.sh

      # ---- GHCR 推送：只在合并进 main 之后 -----------------------------------
      # PR 阶段不推：fork 来的 PR 拿不到 packages 权限，而且把每个 PR 的镜像都推上去
      # 会让仓库里堆满永远不会被部署的 tag。真实推送验证按编排者安排留在合并后。
      - name: 登录 GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      # 推送成功 → 独立回读 digest 写进 summary。
      # 权限不足 → 显式降级：存 tar、summary 写明「未推送」、发 ::warning::，job 仍绿。
      # 其他失败 → 判红。三条路径的分支逻辑在 scripts/ci/push_image.py 里，
      # **不使用 continue-on-error，也不使用 `|| true`**：那样会让三条路径长得一样。
      - name: 推送镜像到 GHCR（权限不足则降级留证）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: build-a
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          for service in scheduler migrate worker; do
            reference="ghcr.io/moshuiwang/lingxi-${service}:${IMAGE_TAG}"
            docker tag "lingxi-${service}:build-a" "${reference}"
            python3 scripts/ci/push_image.py "${reference}" \
              --artifact-dir "${RUNNER_TEMP}/images" \
              --summary-file "${GITHUB_STEP_SUMMARY}" \
              --output-file "${GITHUB_OUTPUT}"
          done

      - name: 降级留证：上传镜像 tar
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lingxi-images-${{ steps.tag.outputs.tag }}
          path: ${{ runner.temp }}/images
          if-no-files-found: ignore
          retention-days: 14
