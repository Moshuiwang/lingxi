name: Epic Full

on:
  pull_request:
    branches:
      - main
  # Story Fast 遇到部署、迁移、依赖或 CI 自身改动时复用同一份完整门禁，
  # 不在两个工作流里复制一套以后必然漂移的检查。
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 面向 main 的 PR，文档改动（包括 docs + L1 混合）都运行文档门禁；纯文档仍不需要
  # 真库、extras 或镜像回归，并产出稳定的 `Epic Full` required check。复用 Story 的
  # 路径分类器，避免在两处维护“什么是文档”。workflow_call / 手动运行一律走完整门禁，
  # 只有 main PR 才允许此轻量分支。
  classify:
    name: Epic / classify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.changes.outputs.mode }}
      risk_level: ${{ steps.changes.outputs.risk_level }}
      docs_changed: ${{ steps.changes.outputs.docs_changed }}
      l1_changed: ${{ steps.changes.outputs.l1_changed }}
      l3_changed: ${{ steps.changes.outputs.l3_changed }}
      image_candidate: ${{ steps.image_candidate.outputs.value }}
    steps:
      - name: 检出代码与比较基线
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 路由改动
        id: changes
        run: |
          python3 scripts/ci/classify_story_changes.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --github-output "${GITHUB_OUTPUT}"

      # Issue #278：跟踪 PR（epic/* -> main）冻结候选镜像构建的机器人可用触发信号。
      # `if:` 表达式读不到提交正文，只能读 github 上下文；这一步把它落成一个
      # job output 给下面 image job 的 `if:` 用。用 `git log -1 --format=%B
      # <head sha>` 而不是 `HEAD`——本步检出的是 pull_request 事件默认的临时
      # merge 提交，其正文是 GitHub 自动生成的合并说明，不是 PR 真正的头提交
      # 正文；上面 fetch-depth: 0 已经把头提交对象拉全，可以直接按 sha 取。
      #
      # 标记用 git trailer 形状（独占一行、精确匹配 `Image-Candidate: true`），
      # 不用行内的 `[image-candidate]` 这类方括号写法——本 PR 实现这条机制时，
      # 描述标记本身的说明文字（这条注释、commit message、deploy/README.md）自然
      # 就会包含方括号写法的字面量，若检测逻辑只做子串匹配，任何"提到这个标记"的
      # 提交（哪怕只是文档说明）都会被误判成"触发"。trailer 形状要求整行精确匹配，
      # 没人会在说明性文字里恰好单独写一行 `Image-Candidate: true`，从根上避免这类
      # 自指误判——本 PR 第一版曾用方括号写法，在自己的 commit message 里被自己的
      # 说明文字意外命中（未影响本 PR 结论，因为 head 不是 epic/*，但暴露了这个坑，
      # 已改用 trailer 形状）。
      - name: 检测冻结候选触发标记
        id: image_candidate
        run: |
          message=$(git log -1 --format=%B "${{ github.event.pull_request.head.sha }}")
          if printf '%s\n' "${message}" | grep -qE '^Image-Candidate: true$'; then
            echo 'value=true' >> "${GITHUB_OUTPUT}"
            echo '检测到冻结候选触发标记 Image-Candidate: true'
          else
            echo 'value=false' >> "${GITHUB_OUTPUT}"
          fi

  docs:
    name: Epic Full / docs
    needs: [classify]
    if: >-
      github.event_name == 'pull_request' && github.base_ref == 'main' &&
      needs.classify.outputs.docs_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 运行文档门禁
        run: scripts/ci/verify_docs.sh

  l1:
    name: Epic Full / l1
    needs: [classify]
    if: >-
      github.event_name == 'pull_request' && github.base_ref == 'main' &&
      needs.classify.outputs.risk_level == 'l1'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 运行 L1 用户可见资产轻门禁
        run: python3 scripts/ci/check_l1_assets.py

      - name: 校验门禁没有改写工作树
        run: test -z "$(git status --porcelain)"

  gate:
    name: Epic Full / gate
    needs: [classify]
    if: >-
      github.event_name != 'pull_request' || github.base_ref != 'main' ||
      (needs.classify.outputs.mode != 'docs' && needs.classify.outputs.risk_level != 'l1')
    runs-on: ubuntu-24.04
    # 本机实测 Python 测试步骤 350s（≈5.8 分钟，679 条，含真库），已超原先的 5 分钟；
    # 而 runner 的波动系数实测可达 3 倍以上——#53 有过一次 90s 量级的工作被拖到 5 分钟
    # 触顶被杀（见 26e9973 的重触发说明）。10 分钟吸收绝大多数波动。
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: lingxi_test
        # 凭据测试经 TCP 连接 localhost:5432，必须把服务端口发布到 runner；
        # 只用 docker exec 的表结构测试不依赖它。
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lingxi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: evidence-only sentinel 未走 L3 路由时硬失败
        if: >-
          github.event_name == 'pull_request' && github.base_ref == 'main' &&
          (needs.classify.outputs.risk_level != 'l3' ||
           needs.classify.outputs.l3_changed != 'true')
        run: |
          if git cat-file -e "${{ github.event.pull_request.head.sha }}:.github/permission-impact-evidence-only" 2>/dev/null; then
            echo 'evidence-only sentinel 必须进入 L3 证据专用流程，禁止合并或部署。' >&2
            exit 1
          fi

      # PR 内的 `.github/permission-impact-counts.json` 只是 biai-stage 声明；它不能
      # 自称可信来源。OWNER reader、prepare 和 check 均从当前 PR 的 trusted base
      # commit 解包执行，避免 head 自改消费者后放行。reader 再用 pull-requests:read
      # 重 GET PR、普通评论和变更文件；缺评论、重复、编辑、过期或信任根变更均失败。
      - name: 从可信 base 读取 GitHub OWNER attestation（L3）
        if: >-
          github.event_name == 'pull_request' &&
          github.base_ref == 'main' &&
          needs.classify.outputs.risk_level == 'l3' &&
          needs.classify.outputs.l3_changed == 'true'
        run: |
          trusted_base="${RUNNER_TEMP}/lingxi-trusted-base"
          mkdir -p "${trusted_base}"
          git archive "${{ github.event.pull_request.base.sha }}" \
            scripts/ci/read_github_owner_attestation.py \
            scripts/ci/prepare_permission_impact_counts.py \
            scripts/ci/check_permission_impact.py \
            | tar -x -C "${trusted_base}"
          test -f "${trusted_base}/scripts/ci/read_github_owner_attestation.py"
          test -f "${trusted_base}/scripts/ci/prepare_permission_impact_counts.py"
          test -f "${trusted_base}/scripts/ci/check_permission_impact.py"
          GITHUB_TOKEN="${{ github.token }}" \
            python3 "${trusted_base}/scripts/ci/read_github_owner_attestation.py" \
            --repository "${GITHUB_WORKSPACE}" \
            --repository-id 1309889651 \
            --repository-name "${GITHUB_REPOSITORY}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --manifest "${GITHUB_WORKSPACE}/.github/permission-impact-counts.json" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-sha "${GITHUB_SHA}" \
            --provenance-output "${RUNNER_TEMP}/permission-impact-provenance.json" \
            --evidence-output "${RUNNER_TEMP}/permission-impact-attestation.json"

      - name: 准备权限影响面计数证明（L3，OWNER attestation 已认证）
        if: >-
          github.event_name == 'pull_request' &&
          github.base_ref == 'main' &&
          needs.classify.outputs.risk_level == 'l3' &&
          needs.classify.outputs.l3_changed == 'true'
        run: |
          trusted_base="${RUNNER_TEMP}/lingxi-trusted-base"
          python3 "${trusted_base}/scripts/ci/prepare_permission_impact_counts.py" \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --head-ref "${{ github.event.pull_request.head.sha }}" \
            --repository "${GITHUB_WORKSPACE}" \
            --manifest "${GITHUB_WORKSPACE}/.github/permission-impact-counts.json" \
            --trusted-provenance "${RUNNER_TEMP}/permission-impact-provenance.json" \
            --output "${RUNNER_TEMP}/permission-impact-counts.json"

      - name: 生成权限影响面 diff（L3）
        if: >-
          github.event_name == 'pull_request' &&
          github.base_ref == 'main' &&
          needs.classify.outputs.risk_level == 'l3' &&
          needs.classify.outputs.l3_changed == 'true'
        run: |
          python3 "${RUNNER_TEMP}/lingxi-trusted-base/scripts/ci/check_permission_impact.py" \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --head-ref "${{ github.event.pull_request.head.sha }}" \
            --user-counts "${RUNNER_TEMP}/permission-impact-counts.json" \
            --trusted-provenance "${RUNNER_TEMP}/permission-impact-provenance.json" \
            --output "${RUNNER_TEMP}/permission-impact.json"

      - name: 留存权限影响面与计数证明（L3）
        if: >-
          github.event_name == 'pull_request' &&
          github.base_ref == 'main' &&
          needs.classify.outputs.risk_level == 'l3' &&
          needs.classify.outputs.l3_changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: permission-impact-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/permission-impact-counts.json
            ${{ runner.temp }}/permission-impact-provenance.json
            ${{ runner.temp }}/permission-impact-attestation.json
            ${{ runner.temp }}/permission-impact.json
          if-no-files-found: error
          retention-days: 30

      - name: evidence-only PR 硬 nonmerge/nondeploy sentinel
        if: >-
          github.event_name == 'pull_request' &&
          github.base_ref == 'main' &&
          needs.classify.outputs.risk_level == 'l3' &&
          needs.classify.outputs.l3_changed == 'true' &&
          success()
        run: |
          mode=$(python3 -c 'import json, os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "permission-impact-attestation.json"), encoding="utf-8"))["pr_mode"])')
          if [ "${mode}" = "evidence-only" ]; then
            echo 'evidence-only PR 只允许留存证据，禁止合并或部署；请由 PM/管理员按规则集流程处理。' >&2
            exit 1
          fi

      - name: L1 资产版本锁与术语扫描（混合高风险改动）
        if: needs.classify.outputs.l1_changed == 'true'
        run: python3 scripts/ci/check_l1_assets.py

      - name: 配置 Worker 校验运行时
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/oauth-bridge/package-lock.json

      - name: 校验 OAuth Worker
        working-directory: workers/oauth-bridge
        run: |
          npm ci
          npm test
          npm run check

      # 此前没有这一步：门禁跑在 runner 镜像碰巧自带的 python3 上。
      # ubuntu-24.04 恰好是 3.12，所以一直没暴露，但那是巧合不是声明。
      - name: 配置 Python 运行时
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # 固定小版本而不是读 pyproject 的 ">=3.12"：后者是开区间，新 Python
          # 发布时门禁会自己跳版本。脚本里另有一道校验，确保这里不低于 pyproject
          # 声明的下限，两边漂移会被发现。
          python-version: '3.12'
          # Issue #43 瘦身（A3）：缓存 pip 下载目录（scheduler / worker extras，
          # 含 claude-agent-sdk 轮子），缓存键取自 pyproject.toml 的哈希。
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      # shellcheck 此前用的是 runner 镜像自带的版本，既没锁定也没打印：同一个提交
      # 可能因为镜像更新得到不同结论。改用 pip 分发并锁版本，本机可装同一个。
      # 装 scheduler 组而不是全量：单测跑完只需要 cryptography 与 psycopg，
      # 不需要 lark-oapi / websockets（两者都只在函数内延迟导入，测试从不走到）。
      # Bot-Test 那一组的依赖由 `Epic Full / extras` 矩阵在干净环境里单独证明装得上。
      # 追加 migrate 组（Issue #53）：门禁的两处迁移检查真的执行 alembic——
      # scripts/ci/check_alembic_revisions.py（建 revision 图，无需数据库）与
      # scripts/ci/check_migration_chain.sh（两条链建库对比）。不装它，这两步会
      # 明确失败而不是跳过，所以这一行就是 alembic 在 CI 里的安装点。
      - name: 安装测试依赖与锁定版本的 shellcheck
        run: python3 -m pip install '.[scheduler,migrate]' 'shellcheck-py==0.11.0.1'

      # 测试跑 PYTHONPATH=src，部署跑 pip 装出来的制品；新增子目录会让两者分叉，
      # 而分叉只在部署时才暴露。必须在仓库目录之外跑，否则只是又测了一遍源码树。
      - name: 校验已安装的包完整
        working-directory: ${{ runner.temp }}
        run: python3 "${GITHUB_WORKSPACE}/scripts/ci/check_installed_package.py"

      # 桩模块只能证明本侧形状没变，证明不了真实 SDK 装得上、HookMatcher 签名兼容。
      # 这一步不调用模型、不使用任何业务凭据，只构造 hooks 配置。
      - name: 真实 Agent SDK 冒烟（不调模型、不用凭据）
        run: |
          python3 -m pip install '.[worker]'
          python3 "${GITHUB_WORKSPACE}/scripts/ci/check_agent_sdk_binding.py"

      - name: 运行基础质量门禁
        env:
          LINGXI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          LINGXI_POSTGRES_DSN: postgresql://postgres@localhost:5432/lingxi_test
        run: scripts/ci/verify_repository.sh

      # 安装与测试都在检出目录里跑。生成物已被 .gitignore 覆盖，但受版本控制的
      # 文件若被改写，此前不会有任何人发现——CI 仍会全绿。
      - name: 校验 CI 没有改写受版本控制的文件
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo 'CI 过程改写了工作树：' >&2
            git status --porcelain >&2
            exit 1
          fi
          echo '工作树洁净：CI 未改写受版本控制的文件'

  # Issue #56：extras 按进程拆分之后，每个组都要被证明「单独装得上、且该进程的运行
  # 依赖真的齐」。必须一组一个**干净虚拟环境**：装在同一个环境里累加，narrower 的组
  # 会白白用上别组带进来的包，检查就永远不会红。
  #
  # gate 里的 `check_installed_package.py`（不带 --process）抓不到这类缺陷：
  # `src/lingxi/` 没有任何模块级第三方 import，缺 psycopg 时全部模块照样 import 成功。
  # 实测对照——把 psycopg 从 scheduler 组删掉后，不带 --process 的检查仍然退出 0，
  # 带 --process 的退出 1。
  extras:
    name: Epic Full / extras (${{ matrix.extra }})
    needs: [classify]
    if: >-
      github.event_name != 'pull_request' || github.base_ref != 'main' ||
      (needs.classify.outputs.mode != 'docs' && needs.classify.outputs.risk_level != 'l1')
    runs-on: ubuntu-24.04
    # migrate 腿在争抢下实测过 4m32s（此前 bot-test 腿也曾 5 分钟触顶，该 extra 已随
    # #146 清退删除）。每条腿只做「干净环境装一个 extra + 导入校验」，8 分钟足够且
    # 仍能挡住真正的挂死。
    timeout-minutes: 8
    strategy:
      # 各组互相独立，一组坏了也要看到其余组的结论。
      fail-fast: false
      matrix:
        # 与 pyproject.toml 的 [project.optional-dependencies] 组名保持一致；
        # 新增 extra 时必须同步加进这里，否则新组没有任何检查覆盖。
        # check_installed_package.py 会三方对账（pyproject / 本矩阵 / 脚本），漏加即红。
        # migrate 是部署时跑一次的迁移作业，不是常驻进程，但同样要证明"单独装得上"：
        # #62 要为它构建镜像，那时缺依赖就是部署当场失败（Issue #53）。
        # reauthorize 复用 scheduler 镜像，但作为独立一次性入口单独验证其 import 闭包。
        extra: [scheduler, reauthorize, worker, gateway, migrate]

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 配置 Python 运行时
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # 与 gate 同一版本；此处不开 pip 缓存，三条矩阵腿的缓存键相同会互相抢占，
          # 而这几个组都是小轮子，省下的时间不值那份噪声。
          python-version: '3.12'

      - name: 在干净虚拟环境里只装这一个 extra
        env:
          EXTRA: ${{ matrix.extra }}
          VENV: ${{ runner.temp }}/venv
        run: |
          python3 -m venv "${VENV}"
          "${VENV}/bin/python" -m pip install ".[${EXTRA}]"
          echo "--- 该环境实际装了什么 ---"
          "${VENV}/bin/python" -m pip list

      # 与 gate 同理，必须在仓库目录之外跑，否则只是又测了一遍源码树。
      - name: 校验制品完整与该进程的运行依赖
        working-directory: ${{ runner.temp }}
        env:
          EXTRA: ${{ matrix.extra }}
          VENV: ${{ runner.temp }}/venv
        run: |
          "${VENV}/bin/python" "${GITHUB_WORKSPACE}/scripts/ci/check_installed_package.py" --process "${EXTRA}"

  # Issue #62：镜像构建与部署门禁。
  #
  # **必须等 gate 与 extras 通过**（codex 审查 P1-4）。上一版让本 job 与 gate 并行，
  # 理由是"gate 快、别互相拖"——但那样一个门禁没过的提交照样会把镜像推上 GHCR，
  # 于是 `biai-stage` 能拉到一个测试没过的 tag，而拉它的人无从知道。
  # 「失败的提交不得获得可部署制品」比「省几分钟」重要，因此加 needs。
  # 代价是本 job 的开始时间推迟到 gate 结束（约 5 分钟），构建本身不变慢。
  #
  # 刻意**不使用矩阵**：本 job 的多数断言是**跨镜像**的（scheduler 与 worker 里都不许
  # 有 lark-oapi、四个镜像共用同一份 check_installed_package.py 对账），拆成矩阵反而
  # 要把镜像在 job 之间搬来搬去（四个合计体积很大）。顺带也就不存在"新增矩阵用了
  # `extra:` 作键、污染 check_installed_package.py 的三方对账正则"这个坑——
  # scripts/ci/check_deploy_contract.py 仍然断言 ci.yml 里 `extra: [...]` 恰好一行。
  # Issue #278：epic 分支合入 main 走的是一条常驻「跟踪 PR」（epic/* -> main，
  # 整个 Epic 期间只开一次，每个 Story 合入 epic 分支都会把它 synchronize 一次）。
  # 这条 PR 存在的每一次 synchronize 都会照原样触发到本 job——Epic D 实测 5 次
  # synchronize 只有 1 次的镜像制品被 `biai-stage` 真正下载用于验收，其余 4 次
  # （其中 1 次还被下一次 synchronize 取消）纯属陪跑（#278）。
  #
  # 下面这行只掐掉这一种场景的**首次自动触发**：pull_request 目标是 main、来源分支
  # 是 epic/**、且既没有显式重跑也没有冻结候选触发标记。gate / extras 仍然每次都
  # 跑——真正费时间、费算力的是这里的双腿八次镜像构建，不是那两个检查。直接 PR 到
  # main 的普通改动（例如 fix/275 这类）**不受影响**，因为它们的 head_ref 不以
  # `epic/` 开头，走的还是原来的自动路径——这正是「PR 检查阶段的可复现性门保持
  # 不变」那部分。
  #
  # 编排者准备冻结候选（要把镜像制品钉在某个 epic 分支头）时的**主姿势**（机器人
  # 身份可执行，见 deploy/README.md「编排者冻结前显式触发镜像构建」一节）：在跟踪
  # PR 的 epic 分支上开一个空提交的 Story PR，squash 合并时把提交信息末尾加一行
  # `Image-Candidate: true`——上面 classify job 的「检测冻结候选触发标记」步骤
  # 会把它读出来传给这里的 `needs.classify.outputs.image_candidate`。之所以不能直接
  # `git push` 空提交到 epic 分支：`epic/**` 挂了 ruleset「仅 Story Fast 后合并」
  # （`pull_request` 规则 + `current_user_can_bypass: never`），机器人身份的直接推送
  # 会被服务端拒绝，只能走「开 PR、Story Fast 通过、squash 合并」这条已有路径。
  #
  # `gh run rerun <run-id>`（全量重跑，不加 --failed）在**有 Actions 写权限的身份**
  # 手上仍然可用，作为备选姿势保留：重跑同一个 run 会原样保留 pull_request 触发
  # 身份（PR 号、head sha 不变），`github.run_attempt` 变成 '2' 时下面这行同样不再
  # 匹配跳过条件。但**本机机器人身份（GitHub App 令牌）对这个仓库没有 Actions 写
  # 权限**——`gh run rerun` 实测返回 403 `Resource not accessible by integration`
  # （2026-08-21 PR #285 现场复验；2026-08-06 已有同样记录），因此不能把它当作机器人
  # 可执行的主姿势，只能留给产品负责人等有权限的身份通过网页手动操作。
  #
  # 不管走哪条姿势，产出的 run 都必须仍是 `event=pull_request`：`Main Publish` 的
  # `verify_epic_candidate.py` 只认这个 event 类型的 run 去找候选证明 artifact，
  # `workflow_dispatch`（本工作流的 `on:` 里一直都有，可用于任意 ref 单独验证镜像
  # 可复现性）产生的 run 在 GitHub API 里 event 永远是 workflow_dispatch，天然满足
  # 不了这个条件，因此不能用它替代冻结候选证明的产出。
  image:
    name: Epic Full / image
    runs-on: ubuntu-24.04
    needs: [classify, gate, extras]
    if: >-
      github.event_name != 'pull_request' || github.base_ref != 'main' ||
      (needs.classify.outputs.mode != 'docs' && needs.classify.outputs.risk_level != 'l1' &&
      (!startsWith(github.head_ref, 'epic/') || github.run_attempt != '1' ||
      needs.classify.outputs.image_candidate == 'true'))
    timeout-minutes: 45
    # **本 job 不要任何写权限**（codex 二轮 P1-1）。它在 pull_request 上也会跑，而
    # 同仓分支的 PR job 会**照样拿到**这里声明的令牌——于是一个被改造过的 workflow
    # 可以在 PR 阶段就推 / 覆盖 GHCR，把"合并后才发布"这道门整个绕过去。
    # 推送因此拆到下面独立的 publish job，只在 push + main 触发。
    permissions:
      contents: read

    steps:
      # 两份检出，**两个不同长度的绝对路径**。可复现性判定要求"同一提交、两个不同
      # 绝对路径的干净 clone 各构建一次"结果零差异；路径长度也故意不同，
      # 这样任何把构建目录写进产物的行为（.pyc 的 co_filename 是最常见的一种）
      # 都会表现为长度不同的字符串，而不是碰巧对齐。
      - name: 检出代码（构建 A）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: build-a

      - name: 检出代码（构建 B，路径刻意更长）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: build-b-second-independent-checkout

      - name: 计算不可变 tag
        id: tag
        run: |
          batch=$(date -u +%Y%m%d)
          short=$(echo "${GITHUB_SHA}" | cut -c1-12)
          echo "batch=${batch}" >> "${GITHUB_OUTPUT}"
          echo "tag=${batch}-${short}" >> "${GITHUB_OUTPUT}"
          echo "不可变 tag：${batch}-${short}"

      # **两腿必须走同一条构建路径，只有最终 tag 不同。**
      #
      # 上一版 A 腿走 build_image.sh、B 腿是裸 `docker build`，于是 A 带上了来源标签
      # （LINGXI_SOURCE_COMMIT / LINGXI_SOURCE_TREE）而 B 的是 `unknown`。等价步骤要
      # 逐字段比 `.Config`，而 Labels 就在 `.Config` 里——两腿**必然**不一致，等价检查
      # 恒红，publish 又 needs 着 image，于是整条发布路径被自己堵死。
      #
      # 修法是让两腿共用 build_image.sh，而不是给 B 腿补一个 --build-arg：后者能让这次
      # 变绿，但下次再往构建里加任何一个参数，同样的漂移会重演一遍。构建方式只有一处
      # 定义，就没有"两处保持同步"这件事需要有人记得。
      - name: 构建四个镜像（构建 A）
        working-directory: build-a
        env:
          LINGXI_IMAGE_BATCH: ${{ steps.tag.outputs.batch }}
          LINGXI_IMAGE_COMMIT: ${{ github.sha }}
        run: |
          for service in scheduler migrate gateway worker; do
            LINGXI_IMAGE_REFERENCE_FILE="${RUNNER_TEMP}/reference-${service}" \
              scripts/ci/build_image.sh "${service}" --no-cache
            docker tag "$(cat "${RUNNER_TEMP}/reference-${service}")" "lingxi-${service}:build-a"
          done

      # 与 A 腿**逐字相同**的构建命令，只是工作目录不同、产出改打 :build-b。
      # build_image.sh 会把两腿产出的镜像打上同一个 <批次>-<sha> tag；B 腿构建时那个
      # tag 会指向 B 的镜像，而 A 的镜像已经另外打了 :build-a，不受影响。
      - name: 构建四个镜像（构建 B，独立目录、冷缓存）
        working-directory: build-b-second-independent-checkout
        env:
          LINGXI_IMAGE_BATCH: ${{ steps.tag.outputs.batch }}
          LINGXI_IMAGE_COMMIT: ${{ github.sha }}
        run: |
          for service in scheduler migrate gateway worker; do
            LINGXI_IMAGE_REFERENCE_FILE="${RUNNER_TEMP}/reference-b-${service}" \
              scripts/ci/build_image.sh "${service}" --no-cache
            docker tag "$(cat "${RUNNER_TEMP}/reference-b-${service}")" "lingxi-${service}:build-b"
          done

      # 断言 V-部署-06 / M2-62-05：**内容级**等价，不是 manifest digest 相等。
      # 镜像配置里有 created 时间戳，所以同一份 rootfs 每次构建的 digest 必然不同；
      # 拿 digest 当判据只会得到"永远不等价"这个无用结论。
      - name: 两次构建产物等价（内容级）
        working-directory: build-a
        run: |
          status=0
          for service in scheduler migrate gateway worker; do
            python3 scripts/ci/image_manifest.py "lingxi-${service}:build-a" --output "/tmp/${service}-a.txt"
            python3 scripts/ci/image_manifest.py "lingxi-${service}:build-b" --output "/tmp/${service}-b.txt"
            if diff -u "/tmp/${service}-a.txt" "/tmp/${service}-b.txt" > "/tmp/${service}.diff"; then
              echo "${service}：两次构建内容清单零差异"
            else
              echo "${service}：两次构建内容不等价" >&2
              head -50 "/tmp/${service}.diff" >&2
              status=1
            fi
            docker inspect --format '{{json .Config}}' "lingxi-${service}:build-a" > "/tmp/${service}-cfg-a.json"
            docker inspect --format '{{json .Config}}' "lingxi-${service}:build-b" > "/tmp/${service}-cfg-b.json"
            if ! diff -u "/tmp/${service}-cfg-a.json" "/tmp/${service}-cfg-b.json"; then
              echo "${service}：.Config 不一致" >&2
              status=1
            fi
          done
          exit "${status}"

      - name: 镜像部署契约逐条核对
        working-directory: build-a
        run: |
          scripts/ci/verify_image_contract.sh \
            lingxi-scheduler:build-a lingxi-worker:build-a \
            lingxi-migrate:build-a lingxi-gateway:build-a

      # 断言 V-部署-05 的本地演法（编排者裁定①）：真库升到 head，追加一条合成的
      # 前滚迁移，再用**迁移前构建的镜像**启动 scheduler 跑完一轮并优雅退出。
      - name: 旧镜像在新库结构上启动（V-部署-05）
        working-directory: build-a
        run: scripts/ci/verify_old_image_new_schema.sh lingxi-scheduler:build-a lingxi-migrate:build-a

      # stage 与生产 compose 必须结构相同、只有配置不同（M2-62-13）。
      - name: Compose 结构对照（stage ↔ 生产）
        working-directory: build-a
        run: scripts/ci/verify_compose_structure.sh

      # Issue #150：合并前把这次通过契约核对的四镜像（A 腿，与 B 腿内容级等价）
      # 导出为可下载 artifact，并生成绑定 PR head SHA / Git tree / 构建输入的 manifest。
      # 只在真实 PR 触发时产出——workflow_dispatch 手动运行没有 PR 身份可绑定，不导出。
      #
      # **刻意排在本 job 全部门禁（V-部署-05、Compose 结构对照）之后**（#150 审查 P2）：
      # 既有的 epic-candidate-pr-* 只在 candidate job 断言全绿之后才上传，
      # "artifact 存在即代表这次构建全绿"是既有语义；若导出/上传排在门禁前面，
      # 门禁红了 artifact 仍然留存 14 天可下载，stage 就可能验收一份自校验通过、
      # 但 Epic Full 实际未通过的候选。
      - name: 导出四镜像候选并生成 manifest（Issue #150）
        if: github.event_name == 'pull_request'
        working-directory: build-a
        run: |
          python3 scripts/ci/write_epic_candidate_images.py \
            --repository "${GITHUB_REPOSITORY}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --tested-sha "${GITHUB_SHA}" \
            --tree-sha "$(git rev-parse 'HEAD^{tree}')" \
            --run-id "${GITHUB_RUN_ID}" \
            --batch "${{ steps.tag.outputs.batch }}" \
            --output-dir "${RUNNER_TEMP}/epic-candidate-images" \
            --image "scheduler=lingxi-scheduler:build-a" \
            --image "migrate=lingxi-migrate:build-a" \
            --image "gateway=lingxi-gateway:build-a" \
            --image "worker=lingxi-worker:build-a"

      # 上传前自校验：manifest 与四个 tar 的 sha256/大小/服务集合必须彼此一致，
      # 否则宁可让 job 红，也不上传一份看起来齐全、实际对不上的候选包。
      - name: 自校验候选镜像包结构（Issue #150）
        if: github.event_name == 'pull_request'
        working-directory: build-a
        run: |
          python3 scripts/ci/verify_epic_candidate_bundle.py \
            "${RUNNER_TEMP}/epic-candidate-images" \
            --expect-repository "${GITHUB_REPOSITORY}" \
            --expect-pr-number "${{ github.event.pull_request.number }}" \
            --expect-head-sha "${{ github.event.pull_request.head.sha }}" \
            --expect-tree-sha "$(git rev-parse 'HEAD^{tree}')" \
            --expect-run-id "${GITHUB_RUN_ID}"

      # 命名与 epic-candidate-pr-* 并列但不同名：那份 artifact 只装 candidate.json，
      # Main Publish 的 verify_epic_candidate.py 断言其文件列表恰好是 ["candidate.json"]，
      # 混进 tar 会直接破坏合并后的候选回读。四镜像候选必须是独立的 artifact。
      # 保存期 14 天，与 publish.yml「降级留证：上传镜像 tar」一致——同类产物同一保存期，
      # 不为 PR 候选单独定一个更长的期限。
      - name: 留存候选镜像 artifact（Issue #150）
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: epic-candidate-images-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/epic-candidate-images
          if-no-files-found: error
          retention-days: 14

  # required check 只认这个稳定名称。main 的纯文档 PR 只要求分类器和文档校验；
  # 跟踪 PR（head 为 epic/**）没有冻结候选触发标记的自动 synchronize 只要求 gate、
  # 五组 extras 通过，image 允许是 skipped（#278：见上面 image job 的按需触发说明）；
  # 除此之外的 PR（含直接 PR 到 main 的普通改动、以及带 `Image-Candidate: true`
  # 标记或显式 `gh run rerun` 之后的那次尝试）要求 gate、五组 extras、四镜像双构建全部
  # 成功，并留下一份带树摘要的候选证明。main Publish 只接受与该证明相同的合并树；
  # 因此合并后无需再跑一遍完整门禁。
  candidate:
    name: Epic Full
    runs-on: ubuntu-24.04
    if: always()
    needs: [classify, docs, l1, gate, extras, image]
    timeout-minutes: 3

    steps:
      - name: 确认完整门禁全部通过
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          MODE: ${{ needs.classify.outputs.mode }}
          RISK_LEVEL: ${{ needs.classify.outputs.risk_level }}
          DOCS_CHANGED: ${{ needs.classify.outputs.docs_changed }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          L1_RESULT: ${{ needs.l1.result }}
          GATE_RESULT: ${{ needs.gate.result }}
          EXTRAS_RESULT: ${{ needs.extras.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          if [ "${EVENT_NAME}" = pull_request ] && [ "${CLASSIFY_RESULT}" != success ]; then
            printf 'Epic 分类器未通过：%s\n' "${CLASSIFY_RESULT}" >&2
            exit 1
          fi
          if [ "${EVENT_NAME}" = pull_request ] && [ "${DOCS_CHANGED}" = true ] \
             && [ "${DOCS_RESULT}" != success ]; then
            # main PR 的 Epic Full / docs 应运行；epic/** -> main 的跟踪 PR 通过
            # Story Fast / docs 覆盖文档，复用进来的 Epic Full / docs 按设计 skipped。
            # Story Fast 的 story-result 另行要求 caller 的 docs=success。
            # 后者只允许恰好是 skipped；若 Epic 侧意外失败/取消，仍不能被汇总吞掉。
            case "${BASE_REF}:${DOCS_RESULT}" in
              epic/*:skipped) : ;;
              *)
                printf '候选文档门禁未通过：base=%s result=%s\n' \
                  "${BASE_REF}" "${DOCS_RESULT}" >&2
                exit 1
                ;;
            esac
          fi
          if [ "${EVENT_NAME}" = pull_request ] && [ "${BASE_REF}" = main ] \
             && [ "${MODE}" = docs ] && [ "${RISK_LEVEL}" = l0 ]; then
            if [ "${CLASSIFY_RESULT}" != success ] || [ "${DOCS_RESULT}" != success ]; then
              printf '纯文档候选未通过：classify=%s docs=%s\n' \
                "${CLASSIFY_RESULT}" "${DOCS_RESULT}" >&2
              exit 1
            fi
            echo 'Epic 纯文档候选：文档门禁通过；不运行真库、extras 或镜像构建'
            exit 0
          fi
          if [ "${EVENT_NAME}" = pull_request ] && [ "${BASE_REF}" = main ] \
             && [ "${RISK_LEVEL}" = l1 ]; then
            if [ "${CLASSIFY_RESULT}" != success ] || [ "${L1_RESULT}" != success ]; then
              printf 'L1 用户可见资产候选未通过：classify=%s l1=%s\n' \
                "${CLASSIFY_RESULT}" "${L1_RESULT}" >&2
              exit 1
            fi
            echo 'Epic L1 候选：版本/锁/术语轻门禁通过；不运行真库、extras 或镜像构建'
            exit 0
          fi
          # Issue #278：跟踪 PR（epic/* -> main）首次自动触发的 synchronize，image
          # 被上面的 job 级 if 故意跳过——这不是失败，只是还没人显式要一份镜像。
          # 只要求 gate/extras 通过；不产出候选证明（下面两步同样按 image 是否
          # success 把关，不靠这里的 exit 0 兜底）。
          case "${HEAD_REF}" in epic/*) is_epic_head=1 ;; *) is_epic_head=0 ;; esac
          if [ "${EVENT_NAME}" = pull_request ] && [ "${BASE_REF}" = main ] \
             && [ "${is_epic_head}" = 1 ] && [ "${RUN_ATTEMPT}" = 1 ] && [ "${IMAGE_RESULT}" = skipped ]; then
            if [ "${GATE_RESULT}" != success ] || [ "${EXTRAS_RESULT}" != success ]; then
              printf 'Epic 分支同步未通过：gate=%s extras=%s\n' "${GATE_RESULT}" "${EXTRAS_RESULT}" >&2
              exit 1
            fi
            echo 'Epic 分支同步：gate/extras 通过；镜像按需触发，本次未自动构建，不产出候选证明'
            echo '如需为这次同步产出候选证明与候选镜像：在 epic 分支上开一个空提交的 Story PR，'
            echo 'squash 合并时把提交信息末尾加一行 Image-Candidate: true（见 deploy/README.md）；'
            echo '或者由有 Actions 写权限的身份对本次 run 执行 `gh run rerun <run-id>`（全量重跑）。'
            exit 0
          fi
          if [ "${GATE_RESULT}" != success ] || [ "${EXTRAS_RESULT}" != success ] || [ "${IMAGE_RESULT}" != success ]; then
            printf 'Epic 候选未冻结：gate=%s extras=%s image=%s\n' \
              "${GATE_RESULT}" "${EXTRAS_RESULT}" "${IMAGE_RESULT}" >&2
            exit 1
          fi
          echo 'Epic 候选完整门禁：全部通过'

      # 三步都额外要求 image 真正 success（不是「非文档」就够）：Issue #278 之后，
      # 跟踪 PR 的自动 synchronize 里 image 常态是 skipped，此时绝不能写出候选
      # 证明——那会让 Main Publish 误以为一份从没验证过可复现构建的树可以发布。
      - name: 检出代码
        if: >-
          github.event_name == 'pull_request' &&
          !(github.base_ref == 'main' &&
          (needs.classify.outputs.mode == 'docs' || needs.classify.outputs.risk_level == 'l1')) &&
          needs.image.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 写入候选身份
        if: >-
          github.event_name == 'pull_request' &&
          !(github.base_ref == 'main' &&
          (needs.classify.outputs.mode == 'docs' || needs.classify.outputs.risk_level == 'l1')) &&
          needs.image.result == 'success'
        run: |
          python3 scripts/ci/write_epic_candidate.py \
            --repository "${GITHUB_REPOSITORY}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --tested-sha "${GITHUB_SHA}" \
            --tree-sha "$(git rev-parse 'HEAD^{tree}')" \
            --run-id "${GITHUB_RUN_ID}" \
            --output "${RUNNER_TEMP}/epic-candidate/candidate.json"

      - name: 留存候选证明
        if: >-
          github.event_name == 'pull_request' &&
          !(github.base_ref == 'main' &&
          (needs.classify.outputs.mode == 'docs' || needs.classify.outputs.risk_level == 'l1')) &&
          needs.image.result == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: epic-candidate-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/epic-candidate/candidate.json
          if-no-files-found: error
          retention-days: 30
