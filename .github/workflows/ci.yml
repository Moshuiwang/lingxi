name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: CI / gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: lingxi_test
        # 凭据测试经 TCP 连接 localhost:5432，必须把服务端口发布到 runner；
        # 只用 docker exec 的表结构测试不依赖它。
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lingxi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 配置 Worker 校验运行时
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/oauth-bridge/package-lock.json

      - name: 校验 OAuth Worker
        working-directory: workers/oauth-bridge
        run: |
          npm ci
          npm test
          npm run check

      # 此前没有这一步：门禁跑在 runner 镜像碰巧自带的 python3 上。
      # ubuntu-24.04 恰好是 3.12，所以一直没暴露，但那是巧合不是声明。
      - name: 配置 Python 运行时
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # 固定小版本而不是读 pyproject 的 ">=3.12"：后者是开区间，新 Python
          # 发布时门禁会自己跳版本。脚本里另有一道校验，确保这里不低于 pyproject
          # 声明的下限，两边漂移会被发现。
          python-version: '3.12'

      - name: 安装 Bot-Test 凭据测试依赖
        run: python3 -m pip install '.[feishu]'

      # 测试跑 PYTHONPATH=src，部署跑 pip 装出来的制品；新增子目录会让两者分叉，
      # 而分叉只在部署时才暴露。必须在仓库目录之外跑，否则只是又测了一遍源码树。
      - name: 校验已安装的包完整
        working-directory: ${{ runner.temp }}
        run: python3 "${GITHUB_WORKSPACE}/scripts/ci/check_installed_package.py"

      - name: 运行基础质量门禁
        env:
          LINGXI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          LINGXI_POSTGRES_DSN: postgresql://postgres@localhost:5432/lingxi_test
        run: scripts/ci/verify_repository.sh
