name: Story Fast

on:
  pull_request:
    branches:
      - 'epic/**'

permissions:
  contents: read

concurrency:
  group: story-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Story / classify
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.changes.outputs.mode }}
      risk_level: ${{ steps.changes.outputs.risk_level }}
      docs_changed: ${{ steps.changes.outputs.docs_changed }}
      l1_changed: ${{ steps.changes.outputs.l1_changed }}
      l3_changed: ${{ steps.changes.outputs.l3_changed }}
      worker_changed: ${{ steps.changes.outputs.worker_changed }}
    steps:
      - name: 检出代码与比较基线
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 路由改动
        id: changes
        run: |
          python3 scripts/ci/classify_story_changes.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --github-output "${GITHUB_OUTPUT}"

  docs:
    name: Story / docs
    needs: classify
    if: needs.classify.outputs.docs_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 运行文档门禁
        run: scripts/ci/verify_docs.sh

  fast:
    name: Story / code fast
    needs: classify
    if: needs.classify.outputs.mode == 'fast' && needs.classify.outputs.risk_level != 'l1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 配置 Python 运行时
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装快速门禁依赖
        run: python3 -m pip install '.[scheduler,migrate,worker]' 'shellcheck-py==0.11.0.1'

      - name: 配置 Worker 校验运行时
        if: needs.classify.outputs.worker_changed == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/oauth-bridge/package-lock.json

      - name: 校验 OAuth Worker
        if: needs.classify.outputs.worker_changed == 'true'
        working-directory: workers/oauth-bridge
        run: |
          npm ci
          npm test
          npm run check

      - name: 校验已安装的包完整
        working-directory: ${{ runner.temp }}
        run: python3 "${GITHUB_WORKSPACE}/scripts/ci/check_installed_package.py"

      - name: 真实 Agent SDK 构造冒烟
        run: python3 scripts/ci/check_agent_sdk_binding.py

      - name: 运行无真库、无镜像的仓库门禁
        run: scripts/ci/verify_repository.sh

      - name: L1 资产版本锁与术语扫描（混合改动）
        if: needs.classify.outputs.l1_changed == 'true'
        run: python3 scripts/ci/check_l1_assets.py

      - name: 校验门禁没有改写工作树
        run: test -z "$(git status --porcelain)"

  l1:
    name: Story / content l1
    needs: classify
    if: needs.classify.outputs.risk_level == 'l1'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 运行 L1 用户可见资产轻门禁
        run: python3 scripts/ci/check_l1_assets.py

      - name: 校验门禁没有改写工作树
        run: test -z "$(git status --porcelain)"

  full:
    name: Story / high-risk full
    needs: classify
    if: needs.classify.outputs.mode == 'full'
    uses: ./.github/workflows/ci.yml

  story-result:
    name: Story Fast
    needs: [classify, docs, l1, fast, full]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: 汇总唯一适用的门禁
        env:
          MODE: ${{ needs.classify.outputs.mode }}
          RISK_LEVEL: ${{ needs.classify.outputs.risk_level }}
          DOCS_CHANGED: ${{ needs.classify.outputs.docs_changed }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          L1_RESULT: ${{ needs.l1.result }}
          FAST_RESULT: ${{ needs.fast.result }}
          FULL_RESULT: ${{ needs.full.result }}
        run: |
          if [ "${CLASSIFY_RESULT}" != success ]; then
            echo 'Story 路由失败' >&2
            exit 1
          fi
          if [ "${DOCS_CHANGED}" = true ] && [ "${DOCS_RESULT}" != success ]; then
            echo "Story 文档门禁未通过：${DOCS_RESULT}" >&2
            exit 1
          fi
          case "${RISK_LEVEL}" in
            l0) selected=${DOCS_RESULT} ;;
            l1) selected=${L1_RESULT} ;;
            fast) selected=${FAST_RESULT} ;;
            l2|l3|full) selected=${FULL_RESULT} ;;
            *) echo "未知 Story 路由：${MODE}" >&2; exit 1 ;;
          esac
          if [ "${selected}" != success ]; then
            echo "Story ${RISK_LEVEL} 门禁未通过：${selected}" >&2
            exit 1
          fi
          echo "Story ${RISK_LEVEL} 门禁：通过（兼容 mode=${MODE}）"
