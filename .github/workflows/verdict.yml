name: Epic Verdict

# 裁决层：`main` / `release/**` 的必需检查 `Epic Verdict` 由本工作流以独立 App 身份写出。
#
# 为什么要有它：`pull_request` 事件跑的是 PR 自带那一版工作流，而必需检查只按名字匹配、
# 不看来源——一个 PR 可以在同一次提交里放松门禁，再由被它改过的门禁给自己盖章；
# 甚至直接放一个同名普通作业顶替。能区分来源的只有 App 身份，所以规则集把 `Epic Verdict`
# 的来源钉在 App `lingxi-verdict` 上，而该 App 的私钥只放在仅对 `main` 开放的
# Environment `verdict` 里：`workflow_run` 一律运行默认分支上的这一份，PR 分支上的任何
# 运行都拿不到那把钥匙。
#
# 判定规则在 scripts/ci/verdict_decision.py（同样取自默认分支，逐条用例钉住）：
#   路径 a：触发运行留下的 OIDC 身份凭证验签通过、声明合格（签给本仓这次 run、
#           pull_request 事件、base 是默认分支）、且 PR 头提交的 .github/workflows
#           子树与凭证声明的 base 分支相同 → 采信这次 Epic Full 的结论；
#   路径 b：其余一律由 main 版 ci.yml 以 test_ref 复跑一次，取复跑结论；PR 改了门禁定义时
#           另给 PR 贴标签「门禁定义已变更」+ 评论差异清单（事后可查，不阻塞）；
#   外部仓库的头提交一律判红；非 pull_request 事件、非 ci.yml 产出的运行不裁决。
#
# 本工作流全程**不检出、不执行 PR 树上的任何文件**——唯一例外是路径 b 的复跑，那是
# main 版 ci.yml 在自己的作业里检出被测提交，与今天 workflow_dispatch 跑任意 ref 同理。
# 只有 `success` 算通过：GitHub 把 skipped / neutral 也算通过，这里不算。
on:
  workflow_run:
    workflows: ["Epic Full"]
    types: [completed]

permissions:
  contents: read

# 同一头提交的裁决串行：两次 Epic Full 完成（例如有权限的身份重跑）不并发写同一个 check run。
concurrency:
  group: verdict-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  decide:
    name: Epic Verdict / decide
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      path: ${{ steps.decide.outputs.path }}
      write_check: ${{ steps.decide.outputs.write_check }}
      conclusion: ${{ steps.decide.outputs.conclusion }}
      summary: ${{ steps.decide.outputs.summary }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
      base_label: ${{ steps.decide.outputs.base_label }}
      run_url: ${{ steps.decide.outputs.run_url }}
      definitions_changed: ${{ steps.decide.outputs.definitions_changed }}
      diff: ${{ steps.decide.outputs.diff }}
    steps:
      # 检出的是默认分支（workflow_run 的 GITHUB_SHA = 默认分支最新提交），只为读取裁决脚本。
      - name: 检出默认分支（只读裁决脚本）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pull_requests[] 偶尔为空（事件送达时 PR 尚未关联），按头提交反查一次；反查结果
      # 与事件里的形状一致（number / base.ref / base.sha / head.sha），交给脚本统一选基线。
      - name: 反查 PR 关联（仅当事件里为空）
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo '[]' > "${RUNNER_TEMP}/fallback-pulls.json"
          count=$(jq '.workflow_run.pull_requests | length' "${GITHUB_EVENT_PATH}")
          if [ "${count}" = 0 ] && [ -n "${HEAD_SHA}" ]; then
            gh api "repos/${REPOSITORY}/commits/${HEAD_SHA}/pulls" \
              --jq '[.[] | {number: .number, base: {ref: .base.ref, sha: .base.sha}, head: {sha: .head.sha}}]' \
              > "${RUNNER_TEMP}/fallback-pulls.json"
            echo "事件里没有 PR 关联，按头提交反查到 $(jq length "${RUNNER_TEMP}/fallback-pulls.json") 条"
          fi

      # 信任来源：触发运行在 candidate 作业里留下的 OIDC 身份凭证（制品 epic-verdict-token-<头 sha>）。
      # 凭证由 GitHub 签名，声明里写着这次运行的 run_id / base_ref / event_name / sha，PR 改不了。
      # 取不到制品、取不到 JWKS、验签或任一声明不符，都不采信、走路径 b。
      - name: 取触发运行留下的身份凭证制品
        id: token
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/verdict-token"
          if [ -n "${RUN_ID}" ] && [ -n "${HEAD_SHA}" ] \
             && gh run download "${RUN_ID}" --repo "${REPOSITORY}" \
                  --name "epic-verdict-token-${HEAD_SHA}" --dir "${RUNNER_TEMP}/verdict-token" \
             && [ -s "${RUNNER_TEMP}/verdict-token/token.jwt" ]; then
            echo '已取到身份凭证制品（不打印）'
          else
            rm -rf "${RUNNER_TEMP}/verdict-token"
            echo '触发运行没有身份凭证制品：本次不采信、走路径 b' >&2
          fi
          curl -sSf --max-time 30 https://token.actions.githubusercontent.com/.well-known/jwks \
            -o "${RUNNER_TEMP}/jwks.json" \
            || { rm -f "${RUNNER_TEMP}/jwks.json"; echo '取 JWKS 失败：本次不采信、走路径 b' >&2; }

      # 验签只用标准库 + cryptography（与 pyproject 的锁版一致），不引入新的第三方 action。
      - name: 配置 Python 运行时
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: 安装验签依赖（锁版）
        run: python3 -m pip install --quiet --disable-pip-version-check 'cryptography==45.0.7'

      - name: 验签并核对声明
        id: verify
        run: |
          python3 scripts/ci/verdict_decision.py verify \
            --event-file "${GITHUB_EVENT_PATH}" \
            --token-file "${RUNNER_TEMP}/verdict-token/token.jwt" \
            --jwks-file "${RUNNER_TEMP}/jwks.json" \
            --github-output "${GITHUB_OUTPUT}"

      # 凭证里的 sha 在 pull_request 事件下是临时合并提交：取它的父提交，既把凭证绑到头提交
      # （第二个父提交 = 头提交），也拿到运行时真正被合并进去的 base 顶点（第一个父提交）。
      - name: 取凭证所指合并提交的父提交
        if: steps.verify.outputs.token_status == 'ok' && steps.verify.outputs.token_sha != steps.verify.outputs.head_sha
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TOKEN_SHA: ${{ steps.verify.outputs.token_sha }}
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/git/commits/${TOKEN_SHA}" --jq '[.parents[].sha]' \
            > "${RUNNER_TEMP}/merge-parents.json" \
            || { rm -f "${RUNNER_TEMP}/merge-parents.json"; echo '取不到凭证所指提交的父提交：本次不采信、走路径 b' >&2; }

      - name: 选基线
        id: plan
        run: |
          python3 scripts/ci/verdict_decision.py plan \
            --event-file "${GITHUB_EVENT_PATH}" \
            --fallback-pulls-file "${RUNNER_TEMP}/fallback-pulls.json" \
            --token-file "${RUNNER_TEMP}/verdict-token/token.jwt" \
            --jwks-file "${RUNNER_TEMP}/jwks.json" \
            --merge-parents-file "${RUNNER_TEMP}/merge-parents.json" \
            --github-output "${GITHUB_OUTPUT}"

      # 只读 Git 对象：两侧 .github/workflows 子树的树对象 sha 与文件清单。不 fetch、不检出。
      # 凭证合格时基线 = 合并提交的第一个父提交；否则退回事件里的 PR 或默认分支，那份子树
      # 只用于比对与差异清单，不用于采信触发运行。
      - name: 取两侧 .github/workflows 子树
        id: trees
        if: steps.plan.outputs.needs_trees == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ steps.plan.outputs.head_sha }}
          BASE_COMMITISH: ${{ steps.plan.outputs.base_sha || steps.plan.outputs.base_ref }}
        run: |
          set -euo pipefail
          subtree() {
            local tree github_tree
            tree=$(gh api "repos/${REPOSITORY}/commits/$1" --jq '.commit.tree.sha')
            github_tree=$(gh api "repos/${REPOSITORY}/git/trees/${tree}" \
              --jq '.tree[] | select(.path == ".github" and .type == "tree") | .sha')
            [ -n "${github_tree}" ] || return 0
            gh api "repos/${REPOSITORY}/git/trees/${github_tree}" \
              --jq '.tree[] | select(.path == "workflows" and .type == "tree") | .sha'
          }
          listing() {
            if [ -n "$1" ]; then
              gh api "repos/${REPOSITORY}/git/trees/$1?recursive=1" --jq '.tree'
            else
              echo '[]'
            fi
          }
          head_tree=$(subtree "${HEAD_SHA}")
          base_tree=$(subtree "${BASE_COMMITISH}")
          listing "${head_tree}" > "${RUNNER_TEMP}/head-workflows.json"
          listing "${base_tree}" > "${RUNNER_TEMP}/base-workflows.json"
          echo "head_tree=${head_tree}" >> "${GITHUB_OUTPUT}"
          echo "base_tree=${base_tree}" >> "${GITHUB_OUTPUT}"
          echo "头提交子树 ${head_tree:-缺失}；基线 ${BASE_COMMITISH} 子树 ${base_tree:-缺失}"

      - name: 裁决
        id: decide
        env:
          HEAD_TREE: ${{ steps.trees.outputs.head_tree }}
          BASE_TREE: ${{ steps.trees.outputs.base_tree }}
        run: |
          python3 scripts/ci/verdict_decision.py decide \
            --event-file "${GITHUB_EVENT_PATH}" \
            --fallback-pulls-file "${RUNNER_TEMP}/fallback-pulls.json" \
            --token-file "${RUNNER_TEMP}/verdict-token/token.jwt" \
            --jwks-file "${RUNNER_TEMP}/jwks.json" \
            --merge-parents-file "${RUNNER_TEMP}/merge-parents.json" \
            --head-tree "${HEAD_TREE}" \
            --base-tree "${BASE_TREE}" \
            --head-listing-file "${RUNNER_TEMP}/head-workflows.json" \
            --base-listing-file "${RUNNER_TEMP}/base-workflows.json" \
            --github-output "${GITHUB_OUTPUT}"

  # 路径 b：相对引用解析的是默认分支上的 ci.yml（不是 PR 那一版），test_ref 让它的各个
  # checkout 步检出被测头提交。classify 因 event_name != pull_request 被跳过，gate / extras /
  # image 走「非 PR 一律完整门禁」既有分支，candidate 只在三者全 success 时通过；不产出候选证明。
  rerun:
    name: Epic Verdict / rerun
    needs: [decide]
    if: needs.decide.outputs.path == 'b'
    # candidate 作业声明了 id-token: write，调用方必须放行否则该作业直接失败；复跑的
    # event_name 是 workflow_run，凭证不会签发，签发了裁决层也不采信。
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci.yml
    with:
      test_ref: ${{ needs.decide.outputs.head_sha }}

  # 「门禁定义已变更」的留痕：标签 + 差异清单评论，只在定义真的与基线不同时贴（来源受染
  # 但定义相同的路径 b 不贴）。与裁决写入互不依赖——这里失败不影响 Epic Verdict。
  label:
    name: Epic Verdict / label
    needs: [decide]
    if: >-
      needs.decide.outputs.path == 'b' && needs.decide.outputs.definitions_changed == 'true' &&
      needs.decide.outputs.pr_number != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # 本作业不检出仓库：gh 认不出 git 远端，`gh label create` 要靠 GH_REPO 定位仓库。
      - name: 贴标签「门禁定义已变更」并评论差异清单
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.decide.outputs.pr_number }}
          HEAD_SHA: ${{ needs.decide.outputs.head_sha }}
          BASE_LABEL: ${{ needs.decide.outputs.base_label }}
          DIFF_JSON: ${{ needs.decide.outputs.diff }}
          TRIGGER_RUN_URL: ${{ needs.decide.outputs.run_url }}
          VERDICT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LABEL: 门禁定义已变更
        run: |
          set -euo pipefail
          gh label create "${LABEL}" --force --color D93F0B \
            --description '本 PR 改了 .github/workflows：Epic Verdict 取 main 版门禁复跑的结论'
          gh api -X POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels" -f "labels[]=${LABEL}"
          marker="<!-- epic-verdict:${HEAD_SHA} -->"
          if gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate --jq '.[].body' \
              | grep -qF "${marker}"; then
            echo "同一头提交已评论过，不重复"
            exit 0
          fi
          {
            printf '%s\n' "${marker}"
            printf '**门禁定义已变更**（Epic Verdict 路径 b）：头提交 `%s` 的 `.github/workflows` 与基线 `%s` 不同，' \
              "${HEAD_SHA}" "${BASE_LABEL}"
            printf 'PR 自己那次 [Epic Full](%s) 的结论不被采信，`Epic Verdict` 取 `main` 版 `ci.yml` 复跑的结论（[裁决运行](%s)）。\n\n' \
              "${TRIGGER_RUN_URL}" "${VERDICT_RUN_URL}"
            printf '差异文件：\n'
            printf '%s' "${DIFF_JSON}" | jq -r '.[] | "- \(.)"'
            printf '\n本评论只留痕、不阻塞；合并后这些定义即成为后续 PR 的基线（两步漂移残余已由产品负责人接受）。\n'
          } > "${RUNNER_TEMP}/comment.md"
          gh api -X POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" -F "body=@${RUNNER_TEMP}/comment.md"

  # 唯一持有 App 私钥的作业：Environment `verdict` 只对 main 开放；写检查只用 App 令牌，
  # 不用 GITHUB_TOKEN（Actions 身份写的检查规则集不采信）。
  verdict:
    name: Epic Verdict / write
    needs: [decide, rerun]
    if: >-
      !cancelled() && needs.decide.result == 'success' &&
      needs.decide.outputs.write_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: verdict
    permissions:
      contents: read
    steps:
      - name: 检出默认分支（只读裁决脚本）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 换取裁决 App 的安装令牌（只要 checks 写权限）
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.VERDICT_APP_ID }}
          private-key: ${{ secrets.VERDICT_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: 定终局结论
        id: final
        env:
          DECIDE_PATH: ${{ needs.decide.outputs.path }}
          DECIDE_CONCLUSION: ${{ needs.decide.outputs.conclusion }}
          DECIDE_SUMMARY: ${{ needs.decide.outputs.summary }}
          RERUN_RESULT: ${{ needs.rerun.result }}
        run: |
          python3 scripts/ci/verdict_decision.py finalize \
            --path "${DECIDE_PATH}" \
            --conclusion "${DECIDE_CONCLUSION}" \
            --rerun-result "${RERUN_RESULT}" \
            --summary "${DECIDE_SUMMARY}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: 写入或更新 Epic Verdict check run
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ needs.decide.outputs.head_sha }}
          CONCLUSION: ${{ steps.final.outputs.conclusion }}
          SUMMARY: ${{ steps.final.outputs.summary }}
          VERDICT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER_RUN_URL: ${{ needs.decide.outputs.run_url }}
        run: |
          set -euo pipefail
          existing=$(gh api "repos/${REPOSITORY}/commits/${HEAD_SHA}/check-runs?check_name=Epic%20Verdict&per_page=100" \
            | python3 scripts/ci/verdict_decision.py check-run existing --app-slug "${APP_SLUG}")
          full_summary=$(printf '%s\n裁决运行：%s\n触发运行：%s' "${SUMMARY}" "${VERDICT_RUN_URL}" "${TRIGGER_RUN_URL}")
          if [ -n "${existing}" ]; then
            python3 scripts/ci/verdict_decision.py check-run payload --update \
              --head-sha "${HEAD_SHA}" --conclusion "${CONCLUSION}" \
              --details-url "${VERDICT_RUN_URL}" --external-id "${GITHUB_RUN_ID}" \
              --summary "${full_summary}" > "${RUNNER_TEMP}/check-run.json"
            gh api -X PATCH "repos/${REPOSITORY}/check-runs/${existing}" \
              --input "${RUNNER_TEMP}/check-run.json" --jq '"已更新 check run \(.id)：\(.name) = \(.conclusion)"'
          else
            python3 scripts/ci/verdict_decision.py check-run payload \
              --head-sha "${HEAD_SHA}" --conclusion "${CONCLUSION}" \
              --details-url "${VERDICT_RUN_URL}" --external-id "${GITHUB_RUN_ID}" \
              --summary "${full_summary}" > "${RUNNER_TEMP}/check-run.json"
            gh api -X POST "repos/${REPOSITORY}/check-runs" \
              --input "${RUNNER_TEMP}/check-run.json" --jq '"已创建 check run \(.id)：\(.name) = \(.conclusion)"'
          fi
