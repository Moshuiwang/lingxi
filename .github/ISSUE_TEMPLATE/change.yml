name: 变更提案
description: 创建一个需要产品确认、实施与验收的变更工作单元
title: "[change] "
labels: ["变更", "待分诊"]
body:
  - type: markdown
    attributes:
      value: |
        本 Issue 就是协作变更的最小说明。只有产品选择、权限、安全或外部依赖边界不明时才等待确认；其余工作可以在明确完成标准后直接编码。
  - type: textarea
    id: to_pm
    attributes:
      label: TO PM
      description: 让产品负责人不读全文就能判断这次更改要不要应用。只写可核对的事实和变动面；“可不可承受”由产品负责人判断，不要写“复杂度可控”“影响可承受”这类无法证伪的结论。事实不足时写“未知”和原因。
      value: |
        - **应用后得到什么**：
        - **不应用的代价**：
        - **代码变动面**：约 N 个文件；是否引入新概念、新分层或新常驻进程
        - **架构变动**：接口（新增 / 不兼容改动 / 无）；数据库（迁移 / 新表 / 字段 / 无）
        - **测试与部署成本**：是否需要新的受控验收、新增 CI 步骤、新的部署或回滚动作
        - **可逆性**：回退方式；不可逆的外部副作用（有则列出）
        - **需要产品负责人拍板的**：没有则写「无，按下述范围直接实施」
    validations:
      required: true
  - type: input
    id: change_id
    attributes:
      label: 关联产品合同或当前能力
      placeholder: "docs/产品合同与外部边界.md；如不适用请说明"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题与预期结果
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与非范围
      description: 简明写出做什么和不做什么。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 可观察的完成标准
      description: 用户、管理员或验证者怎样确认这项工作完成；不要只写技术任务。
    validations:
      required: true
  - type: checkboxes
    id: readiness
    attributes:
      label: 提案就绪检查
      options:
        - label: 已说明 MCP、Claude Code + 百炼、飞书的影响或无影响理由。
          required: true
        - label: 已列出待决策项；若存在，尚未开始实施。
          required: true
  - type: textarea
    id: coordination
    attributes:
      label: 协作与阻塞
      description: 主实施代理、拟用分支、相关 Issue / PR、阻塞关系。
  - type: checkboxes
    id: closeout
    attributes:
      label: 关闭与文档回写
      options:
        - label: 关闭前将检查是否需更新 docs/ 中的产品合同、当前能力或长期决策记录。
          required: true
