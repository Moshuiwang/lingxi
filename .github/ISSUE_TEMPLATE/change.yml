name: 功能或工程变更
description: 创建一个使用 [feature] 或 [task] 标题、具有明确范围与验收标准的工作单元
title: ""
labels: ["变更", "待分诊"]
body:
  - type: textarea
    id: to_pm
    attributes:
      label: TO PM
      description: 让产品负责人不读全文就能判断这次更改要不要应用。只写可核对的事实和变动面；“可不可承受”由产品负责人判断，不要写“复杂度可控”“影响可承受”这类无法证伪的结论。事实不足时写“未知”和原因。
      value: |
        - **应用后得到什么**：
        - **不应用的代价**：
        - **代码变动面**：约 N 个文件；是否引入新概念、新分层或新常驻进程
        - **架构变动**：接口（新增 / 不兼容改动 / 无）；数据库（迁移 / 新表 / 字段 / 无）
        - **谁会调用它**：现有入口；暂无调用方时明确写「暂无调用方，本次只交付组件」
        - **依赖怎么装上**：新增依赖的声明与锁定位置；CI 和部署怎样获得；没有新增依赖写「无」
        - **测试与部署成本**：是否需要新的受控验收、新增 CI 步骤、新的部署或回滚动作
        - **可逆性**：回退方式；不可逆的外部副作用（有则列出）
        - **需要产品负责人拍板的**：没有则写「无，按下述范围直接实施」
    validations:
      required: true
  - type: input
    id: change_id
    attributes:
      label: 关联产品合同或当前能力
      placeholder: "docs/产品合同与外部边界.md；如不适用请说明"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题与预期结果
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与非范围
      description: 简明写出做什么和不做什么。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 可观察的完成标准
      description: 用户、管理员或验证者怎样确认这项工作完成；不要只写技术任务。
    validations:
      required: true
  - type: checkboxes
    id: readiness
    attributes:
      label: 提案就绪检查
      options:
        - label: 已说明 MCP、Claude Code + 百炼、飞书的影响或无影响理由。
          required: true
        - label: 已列出待决策项；若存在，尚未开始实施。
          required: true
  - type: textarea
    id: coordination
    attributes:
      label: 协作与阻塞
      description: 主实施代理、拟用分支、相关 Issue / PR、阻塞关系。
  - type: checkboxes
    id: closeout
    attributes:
      label: 关闭与文档回写
      options:
        - label: 关闭前如改变长期产品事实，将先更新 docs/；否则在 Issue 说明「无需回写」的原因。
          required: true
