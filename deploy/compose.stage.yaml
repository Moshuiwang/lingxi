# `biai-stage` 覆盖（Issue #62 / S11）。与 deploy/compose.prod.yaml **结构完全相同**，
# 只有配置值不同：env_file 指向哪个文件、卷叫什么名字、扫描间隔多长。
#
#   docker compose --env-file deploy/.env.stage \
#     -f deploy/compose.yaml -f deploy/compose.stage.yaml up -d
#
# `--env-file` 不能省：`env_file:` 只把变量注入**容器**，不参与 compose 文件自身的
# `${VAR:?}` 插值。省了它，compose 会说 LINGXI_IMAGE_REGISTRY 没设并直接退出。
# 完整命令见 deploy/README.md（每一条都逐字执行验证过）。
#
# stage 连 `Bot-Test` 与独立测试数据库，**永不连 Bot-Prod 或生产库**
# （验证与门禁「十三、测试数据与身份边界」）。
#
# ---------------------------------------------------------------------------
# 凭据**按服务分文件**，不是几个服务共用一份（Issue #62 codex 审查 P1-1）。
#
# 上一版给三个服务挂同一个 env_file，于是 worker 也拿到了数据库连接串、Fernet 密钥
# 与飞书应用密钥——它一个都不需要。这不是"多给了几个变量"那么轻：worker 跑的是
# Claude Agent SDK，**SDK 会把自己的环境继承给 Claude CLI 子进程与各个 MCP 子进程**。
# 也就是说那份共享 env 会一路流进模型执行环境和第三方 MCP 进程里，而那正是产品合同
# 明令"凭据不进用户环境"要挡住的方向。
#
# 拆开之后每个服务只拿自己那份：
#   .env.stage.scheduler   数据库 DSN、Fernet 密钥、飞书应用凭据
#   .env.stage.gateway     飞书应用凭据 + 数据库 DSN（#57；不含 Fernet 密钥、不含模型凭据）
#   .env.stage.worker      一次性 turn job：只有 LINGXI_WORKER_* 与模型端点凭据，不含数据库
#   .env.stage.worker-queue 常驻队列消费者：数据库 DSN + LINGXI_WORKER_* + 模型端点凭据
#                           （PR #173 复核 P1-2：与 worker 不再共用同一份文件——worker
#                           不需要数据库，worker-queue 需要，共用会让其中一边拿到不该
#                           拿到的东西）
#   .env.stage.migrate     只有迁移 DSN（DDL 权限，业务进程不该有）
#   .env.stage.reauthorize 一次性重授权 job 的数据库、应用与 scope 配置
# 六个运行时文件都匹配 .gitignore 既有的 `.env.*` 规则，不入库；六个都必须 0600，
# 核对步骤见 deploy/README.md 的 preflight。
# ---------------------------------------------------------------------------

services:
  scheduler:
    env_file:
      - ./.env.stage.scheduler
    environment:
      # stage 扫得勤一些，便于受控验证时尽快观察到一轮扫描。
      LINGXI_SCHEDULER_INTERVAL_SECONDS: ${LINGXI_SCHEDULER_INTERVAL_SECONDS:-30}
    # 资源限制：stage 建议值（推导见 deploy/README.md「资源限制」）。stage 主机只有
    # 2 核 / 3.7GiB，六个服务加总必须留出宿主机与 Docker 守护进程本身的余量。
    deploy:
      resources:
        limits:
          cpus: "${LINGXI_SCHEDULER_CPU_LIMIT:-0.5}"
          memory: ${LINGXI_SCHEDULER_MEM_LIMIT:-512M}
          pids: ${LINGXI_SCHEDULER_PIDS_LIMIT:-256}
    volumes:
      - lingxi-credentials:/var/lib/lingxi/credentials
      # 首次开通编排（S-D-02）在这里给每个用户建家目录、写各自的 .mcp.json
      # （Epic D 闸⑤）：挂载点须与 worker/worker-queue 一致，否则
      # LocalUserEnvironment 在真实容器里第一次调用就会因根目录不存在而失败，
      # 整条首次开通编排永远不会注册（见 apps/scheduler/assembly.py 的
      # `_build_onboarding_duty` 前置检查）。scripts/ci/check_deploy_contract.py
      # 的 check_scheduler_user_volume 把这条约束变成会变红的检查。
      - lingxi-users:/var/lib/lingxi/users
      # 闸①「公司+职能→指标名」映射表外置（Issue #320 / #328 S-P0-2）：与下面
      # worker-queue 运行时提示词目录同一套写法——挂目录不挂单文件，理由同
      # worker-queue 卷注释（编辑器"写临时文件再 rename"保存会让单文件绑定挂载
      # 停在旧 inode 上）。只读：scheduler 没有任何理由写它。容器内文件路径由
      # `.env.stage.scheduler` 的 `LINGXI_COMPANY_FUNCTION_METRIC_MAP_PATH` 指定
      # （建议值 `/etc/lingxi/runtime/company_function_metric_map.toml`，见
      # .env.example「文件二」）；未配置该变量时这条挂载没有副作用，scheduler
      # 照读随包默认映射表。**生效时机与 worker-queue 不同，不要套用"编辑即
      # 生效"**：权限重算职责在进程启动时只装配一次（`apps/scheduler/assembly.py`
      # 的 `build_loop` 只调一次 `_build_permission_refresh_duty`，是防止两处
      # 读文件互相漂移的刻意设计），编辑外置文件后需要
      # `docker compose --env-file deploy/.env.stage -f deploy/compose.yaml -f
      # deploy/compose.stage.yaml restart scheduler` 重启 scheduler 容器才生效
      # （不需要重建镜像；prod 同构，把 `.env.stage`/`compose.stage.yaml` 换成
      # `.env.prod`/`compose.prod.yaml`）。不能用 `up -d` 重启 scheduler：compose 配置
      # 未变时它判 up-to-date 不重启，而这里改的正是外置文件、不是 compose 配置；
      # 裸跑 `restart` 缺 `--env-file`/`-f` 也不行，会按 base compose 重建出缺
      # env_file 的容器。重启后可用 digest 日志行（logger
      # `lingxi.adapters.company_function_metric_map_file`，字段
      # path/digest/companies）核对读到了哪一版。例外：每日通报「未覆新指标」
      # 日检段（`apps/scheduler/daily_report.py` 的 `_check`）每次现读，不受
      # 此限、无需重启。
      - ${LINGXI_SCHEDULER_RUNTIME_CONFIG_DIR:-/opt/lingxi/runtime-config}:/etc/lingxi/runtime:ro

  gateway:
    env_file:
      - ./.env.stage.gateway
    deploy:
      resources:
        limits:
          cpus: "${LINGXI_GATEWAY_CPU_LIMIT:-0.5}"
          memory: ${LINGXI_GATEWAY_MEM_LIMIT:-512M}
          pids: ${LINGXI_GATEWAY_PIDS_LIMIT:-256}

  worker:
    env_file:
      - ./.env.stage.worker
    # Agent SDK 一个回合会拉起 Claude CLI 与多个 MCP 子进程；pids 限制过低会
    # 在正常负载下直接杀死本该成功的回合（PM 2026-08-28 裁定明确点名的风险）。
    deploy:
      resources:
        limits:
          cpus: "${LINGXI_WORKER_CPU_LIMIT:-1.5}"
          memory: ${LINGXI_WORKER_MEM_LIMIT:-2G}
          pids: ${LINGXI_WORKER_PIDS_LIMIT:-512}
    volumes:
      - lingxi-users:/var/lib/lingxi/users

  # 常驻 queue worker（Issue #153）：与一次性 `worker` job 是同一镜像，但**独立一份
  # env 文件**（PR #173 复核 P1-2）——worker-queue 常驻领取真实任务，必须拿到
  # `LINGXI_POSTGRES_DSN` 才能启动；一次性 `worker` job 从不碰数据库。共用同一份
  # 文件会让其中一边拿到它不该拿到的东西：要么 worker 意外获得数据库凭据（并经
  # Agent SDK 继承给模型执行环境），要么 worker-queue 拿不到 DSN 而无限崩溃重启。
  worker-queue:
    env_file:
      - ./.env.stage.worker-queue
    environment:
      # Issue #496 / Trace #502：stage 与生产执行并发合同均固定为 4。
      LINGXI_WORKER_MAX_CONCURRENCY: "4"
    # /tmp 内存盘上限（Issue #494）：stage 主机是 t3.medium（2 vCPU / 3.74GiB，
    # 浸泡实测宿主可用内存 1.6~1.7GiB、swap 已用 261MiB），**这块盘写满就等量吃掉
    # 宿主内存**，因此 stage 这一档钉死在 256m 不再往上加；真正解决无界增长的是
    # 会话转录的常规回收路径（apps/worker/session_cleanup.py），不是把盘做大。
    # 生产档采用同一份 256m 合同；prod 侧仍通过外部 `.env.prod` 显式供值并由
    # `${VAR:?}` 门禁确认，见 compose.prod.yaml 同位置。
    tmpfs:
      - /tmp:mode=1777,size=${LINGXI_WORKER_QUEUE_TMPFS_SIZE:-256m}
    # 与一次性 worker job 同一量级（stage 与生产 worker-queue 合同一致，见
    # deploy/README.md）；两套覆盖文件都必须显式保留这份资源声明。
    deploy:
      resources:
        limits:
          cpus: "${LINGXI_WORKER_QUEUE_CPU_LIMIT:-1.5}"
          memory: ${LINGXI_WORKER_QUEUE_MEM_LIMIT:-2G}
          pids: ${LINGXI_WORKER_QUEUE_PIDS_LIMIT:-512}
    volumes:
      - lingxi-users:/var/lib/lingxi/users
      # 默认提示词等运行时可调配置（2026-08-23，产品负责人裁定提示词不进代码不进
      # 镜像）：绑定挂载**目录**而不是单个文件——vim 等编辑器按「写临时文件再
      # rename」保存，单文件绑定会让容器停在旧 inode 上永远看不到新内容；目录
      # 绑定不受影响。worker 每个任务现读 `LINGXI_WORKER_SYSTEM_PROMPT_FILE`
      # 指向的文件（见 .env.example「文件五」），编辑后下一条消息即生效，不需要
      # 重启容器。只读挂载：worker 没有任何理由写它。目录缺失时 docker 会以 root
      # 建出空目录，worker 侧按「文件不可用」逐任务降级并留告警，不影响启动。
      - ${LINGXI_WORKER_RUNTIME_CONFIG_DIR:-/opt/lingxi/runtime-config}:/etc/lingxi/runtime:ro

  migrate:
    env_file:
      - ./.env.stage.migrate
    deploy:
      resources:
        limits:
          cpus: "${LINGXI_MIGRATE_CPU_LIMIT:-0.5}"
          memory: ${LINGXI_MIGRATE_MEM_LIMIT:-512M}
          pids: ${LINGXI_MIGRATE_PIDS_LIMIT:-256}

  reauthorize:
    env_file:
      - ./.env.stage.reauthorize
    deploy:
      resources:
        limits:
          cpus: "${LINGXI_REAUTHORIZE_CPU_LIMIT:-0.5}"
          memory: ${LINGXI_REAUTHORIZE_MEM_LIMIT:-512M}
          pids: ${LINGXI_REAUTHORIZE_PIDS_LIMIT:-256}
    volumes:
      - lingxi-credentials:/var/lib/lingxi/credentials

volumes:
  # 具名卷带上环境前缀：同一台机器上万一并存两套编排，卷不会互相覆盖。
  lingxi-credentials:
    name: lingxi-stage-credentials
  lingxi-users:
    name: lingxi-stage-users
