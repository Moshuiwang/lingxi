# `biai-stage` 覆盖（Issue #62 / S11）。与 deploy/compose.prod.yaml **结构完全相同**，
# 只有配置值不同：env_file 指向哪个文件、卷叫什么名字、扫描间隔多长。
#
#   docker compose --env-file deploy/.env.stage \
#     -f deploy/compose.yaml -f deploy/compose.stage.yaml up -d
#
# `--env-file` 不能省：`env_file:` 只把变量注入**容器**，不参与 compose 文件自身的
# `${VAR:?}` 插值。省了它，compose 会说 LINGXI_IMAGE_REGISTRY 没设并直接退出。
# 完整命令见 deploy/README.md（每一条都逐字执行验证过）。
#
# stage 连 `Bot-Test` 与独立测试数据库，**永不连 Bot-Prod 或生产库**
# （验证与门禁「十三、测试数据与身份边界」）。
#
# ---------------------------------------------------------------------------
# 凭据**按服务分文件**，不是几个服务共用一份（Issue #62 codex 审查 P1-1）。
#
# 上一版给三个服务挂同一个 env_file，于是 worker 也拿到了数据库连接串、Fernet 密钥
# 与飞书应用密钥——它一个都不需要。这不是"多给了几个变量"那么轻：worker 跑的是
# Claude Agent SDK，**SDK 会把自己的环境继承给 Claude CLI 子进程与各个 MCP 子进程**。
# 也就是说那份共享 env 会一路流进模型执行环境和第三方 MCP 进程里，而那正是产品合同
# 明令"凭据不进用户环境"要挡住的方向。
#
# 拆开之后每个服务只拿自己那份：
#   .env.stage.scheduler   数据库 DSN、Fernet 密钥、飞书应用凭据
#   .env.stage.gateway     飞书应用凭据 + 数据库 DSN（#57；不含 Fernet 密钥、不含模型凭据）
#   .env.stage.worker      一次性 turn job：只有 LINGXI_WORKER_* 与模型端点凭据，不含数据库
#   .env.stage.worker-queue 常驻队列消费者：数据库 DSN + LINGXI_WORKER_* + 模型端点凭据
#                           （PR #173 复核 P1-2：与 worker 不再共用同一份文件——worker
#                           不需要数据库，worker-queue 需要，共用会让其中一边拿到不该
#                           拿到的东西）
#   .env.stage.migrate     只有迁移 DSN（DDL 权限，业务进程不该有）
#   .env.stage.reauthorize 一次性重授权 job 的数据库、应用与 scope 配置
# 六个运行时文件都匹配 .gitignore 既有的 `.env.*` 规则，不入库；六个都必须 0600，
# 核对步骤见 deploy/README.md 的 preflight。
# ---------------------------------------------------------------------------

services:
  scheduler:
    env_file:
      - ./.env.stage.scheduler
    environment:
      # stage 扫得勤一些，便于受控验证时尽快观察到一轮扫描。
      LINGXI_SCHEDULER_INTERVAL_SECONDS: ${LINGXI_SCHEDULER_INTERVAL_SECONDS:-30}
    volumes:
      - lingxi-credentials:/var/lib/lingxi/credentials
      # 首次开通编排（S-D-02）在这里给每个用户建家目录、写各自的 .mcp.json
      # （Epic D 闸⑤）：挂载点须与 worker/worker-queue 一致，否则
      # LocalUserEnvironment 在真实容器里第一次调用就会因根目录不存在而失败，
      # 整条首次开通编排永远不会注册（见 apps/scheduler/assembly.py 的
      # `_build_onboarding_duty` 前置检查）。scripts/ci/check_deploy_contract.py
      # 的 check_scheduler_user_volume 把这条约束变成会变红的检查。
      - lingxi-users:/var/lib/lingxi/users

  gateway:
    env_file:
      - ./.env.stage.gateway

  worker:
    env_file:
      - ./.env.stage.worker
    volumes:
      - lingxi-users:/var/lib/lingxi/users

  # 常驻 queue worker（Issue #153）：与一次性 `worker` job 是同一镜像，但**独立一份
  # env 文件**（PR #173 复核 P1-2）——worker-queue 常驻领取真实任务，必须拿到
  # `LINGXI_POSTGRES_DSN` 才能启动；一次性 `worker` job 从不碰数据库。共用同一份
  # 文件会让其中一边拿到它不该拿到的东西：要么 worker 意外获得数据库凭据（并经
  # Agent SDK 继承给模型执行环境），要么 worker-queue 拿不到 DSN 而无限崩溃重启。
  worker-queue:
    env_file:
      - ./.env.stage.worker-queue
    volumes:
      - lingxi-users:/var/lib/lingxi/users

  migrate:
    env_file:
      - ./.env.stage.migrate

  reauthorize:
    env_file:
      - ./.env.stage.reauthorize
    volumes:
      - lingxi-credentials:/var/lib/lingxi/credentials

volumes:
  # 具名卷带上环境前缀：同一台机器上万一并存两套编排，卷不会互相覆盖。
  lingxi-credentials:
    name: lingxi-stage-credentials
  lingxi-users:
    name: lingxi-stage-users
