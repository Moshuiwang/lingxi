# `biplus-prod` 覆盖（Issue #62 / S11）。与 deploy/compose.stage.yaml **结构完全相同**，
# 只有配置值不同。
#
#   docker compose --env-file deploy/.env.prod \
#     -f deploy/compose.yaml -f deploy/compose.prod.yaml up -d
#
# `--env-file` 不能省，理由见 compose.stage.yaml 顶部与 deploy/README.md。
#
# **这里没有 `build:` 键，deploy/compose.yaml 里也没有。** 生产只拉镜像、不构建
# （架构设计「八、部署与发布」）。回滚 = 改 LINGXI_IMAGE_TAG 后 `up -d`，见 deploy/README.md。
#
# 凭据**按服务分文件**，理由见 compose.stage.yaml 顶部的说明（worker 不得拿到数据库
# 与飞书凭据：Agent SDK 会把环境继承给 Claude CLI 与 MCP 子进程；worker-queue 需要
# 数据库 DSN 才能领任务，因此与 worker 各自独立一份文件——PR #173 复核 P1-2）。
# 本环境六个运行时 env 文件：.env.prod.scheduler / .env.prod.gateway / .env.prod.worker /
# .env.prod.worker-queue / .env.prod.migrate / .env.prod.reauthorize，**六个都必须
# 0600**，核对步骤见 deploy/README.md 的 preflight。
#
# 本文件的存在**不代表已经可以部署生产**。按 Issue #62「不在本 Issue 直接执行」：
# 生产部署另建独立 `[ops]` Issue，固定镜像 digest、备份点、执行窗口、观察期和回滚目标。
# 本批只交付编排文件本身，未在任何生产环境执行过。

services:
  scheduler:
    env_file:
      - ./.env.prod.scheduler
    environment:
      LINGXI_SCHEDULER_INTERVAL_SECONDS: ${LINGXI_SCHEDULER_INTERVAL_SECONDS:-60}
    volumes:
      - lingxi-credentials:/var/lib/lingxi/credentials
      # 首次开通编排（S-D-02）在这里给每个用户建家目录、写各自的 .mcp.json
      # （Epic D 闸⑤），理由见 compose.stage.yaml 同名 service 的注释。
      - lingxi-users:/var/lib/lingxi/users
      # 闸①指标映射表外置只读挂载（Issue #320 / #328 S-P0-2），结构与 stage 覆盖
      # 一致，说明见 compose.stage.yaml 同名 service 的卷注释（含生效时机：启动
      # 时一次加载，编辑外置文件后需 `docker compose up -d scheduler` 重启才
      # 生效；每日通报「未覆新指标」日检段现读，不受此限）。
      - ${LINGXI_SCHEDULER_RUNTIME_CONFIG_DIR:-/opt/lingxi/runtime-config}:/etc/lingxi/runtime:ro

  gateway:
    env_file:
      - ./.env.prod.gateway

  worker:
    env_file:
      - ./.env.prod.worker
    volumes:
      - lingxi-users:/var/lib/lingxi/users

  # 常驻 queue worker（Issue #153）：与一次性 `worker` job 是同一镜像，但独立一份
  # env 文件，理由见 compose.stage.yaml 同名 service 的注释（PR #173 复核 P1-2）。
  worker-queue:
    env_file:
      - ./.env.prod.worker-queue
    volumes:
      - lingxi-users:/var/lib/lingxi/users
      # 与 stage 覆盖结构一致（部署门禁要求两侧只许值不同）：默认提示词等运行时
      # 可调配置的只读目录挂载，说明见 compose.stage.yaml 同位置注释与
      # .env.example「文件五」。未配置 LINGXI_WORKER_SYSTEM_PROMPT_FILE 时 worker
      # 不读它，行为与挂载前逐字节一致。
      - ${LINGXI_WORKER_RUNTIME_CONFIG_DIR:-/opt/lingxi/runtime-config}:/etc/lingxi/runtime:ro

  migrate:
    env_file:
      - ./.env.prod.migrate

  reauthorize:
    env_file:
      - ./.env.prod.reauthorize
    volumes:
      - lingxi-credentials:/var/lib/lingxi/credentials

volumes:
  lingxi-credentials:
    name: lingxi-prod-credentials
  lingxi-users:
    name: lingxi-prod-users
