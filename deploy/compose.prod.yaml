# `biplus-prod` 覆盖（Issue #62 / S11）。与 deploy/compose.stage.yaml **结构完全相同**，
# 只有配置值不同。
#
#   docker compose --env-file deploy/.env.prod \
#     -f deploy/compose.yaml -f deploy/compose.prod.yaml up -d
#
# `--env-file` 不能省，理由见 compose.stage.yaml 顶部与 deploy/README.md。
#
# **这里没有 `build:` 键，deploy/compose.yaml 里也没有。** 生产只拉镜像、不构建
# （架构设计「八、部署与发布」）。回滚 = 改 LINGXI_IMAGE_TAG 后 `up -d`，见 deploy/README.md。
#
# 凭据**按服务分文件**，理由见 compose.stage.yaml 顶部的说明（worker 不得拿到数据库
# 与飞书凭据：Agent SDK 会把环境继承给 Claude CLI 与 MCP 子进程；worker-queue 需要
# 数据库 DSN 才能领任务，因此与 worker 各自独立一份文件——PR #173 复核 P1-2）。
# 本环境六个运行时 env 文件：.env.prod.scheduler / .env.prod.gateway / .env.prod.worker /
# .env.prod.worker-queue / .env.prod.migrate / .env.prod.reauthorize，**六个都必须
# 0600**，核对步骤见 deploy/README.md 的 preflight。
#
# 本文件的存在**不代表已经可以部署生产**。按 Issue #62「不在本 Issue 直接执行」：
# 生产部署另建独立 `[ops]` Issue，固定镜像 digest、备份点、执行窗口、观察期和回滚目标。
# 本批只交付编排文件本身，未在任何生产环境执行过。

services:
  scheduler:
    env_file:
      - ./.env.prod.scheduler
    environment:
      LINGXI_SCHEDULER_INTERVAL_SECONDS: ${LINGXI_SCHEDULER_INTERVAL_SECONDS:-60}
    # 资源限制：生产建议值，按架构设计「九、容量与资源」定档（推导见
    # deploy/README.md「资源限制」）。
    deploy:
      resources:
        limits:
          cpus: "${LINGXI_SCHEDULER_CPU_LIMIT:-1.0}"
          memory: ${LINGXI_SCHEDULER_MEM_LIMIT:-1G}
          pids: ${LINGXI_SCHEDULER_PIDS_LIMIT:-512}
    volumes:
      - lingxi-credentials:/var/lib/lingxi/credentials
      # 首次开通编排（S-D-02）在这里给每个用户建家目录、写各自的 .mcp.json
      # （Epic D 闸⑤），理由见 compose.stage.yaml 同名 service 的注释。
      - lingxi-users:/var/lib/lingxi/users
      # 闸①指标映射表外置只读挂载（Issue #320 / #328 S-P0-2），结构与 stage 覆盖
      # 一致，说明见 compose.stage.yaml 同名 service 的卷注释（含生效时机：启动
      # 时一次加载，编辑外置文件后需
      # `docker compose --env-file deploy/.env.prod -f deploy/compose.yaml -f
      # deploy/compose.prod.yaml restart scheduler` 重启才生效，不能用
      # `up -d` 重启 scheduler——compose 配置未变时它判 up-to-date 不重启；每日通报
      # 「未覆新指标」日检段现读，不受此限）。
      - ${LINGXI_SCHEDULER_RUNTIME_CONFIG_DIR:-/opt/lingxi/runtime-config}:/etc/lingxi/runtime:ro

  gateway:
    env_file:
      - ./.env.prod.gateway
    deploy:
      resources:
        limits:
          cpus: "${LINGXI_GATEWAY_CPU_LIMIT:-1.0}"
          memory: ${LINGXI_GATEWAY_MEM_LIMIT:-1G}
          pids: ${LINGXI_GATEWAY_PIDS_LIMIT:-512}

  worker:
    env_file:
      - ./.env.prod.worker
    deploy:
      resources:
        limits:
          cpus: "${LINGXI_WORKER_CPU_LIMIT:-2.0}"
          memory: ${LINGXI_WORKER_MEM_LIMIT:-4G}
          pids: ${LINGXI_WORKER_PIDS_LIMIT:-1024}
    volumes:
      - lingxi-users:/var/lib/lingxi/users

  # 常驻 queue worker（Issue #153）：与一次性 `worker` job 是同一镜像，但独立一份
  # env 文件，理由见 compose.stage.yaml 同名 service 的注释（PR #173 复核 P1-2）。
  worker-queue:
    env_file:
      - ./.env.prod.worker-queue
    environment:
      # Issue #496 / Trace #502：执行并发硬上限由产品负责人固定为 4。值来自外部
      # 根 `deploy/.env.prod`，不是仓库中的真实生产文件；`${VAR:?}` 让漏配直接
      # 阻止 compose 渲染，不能退回一个未审计的默认值。
      LINGXI_WORKER_MAX_CONCURRENCY: "${LINGXI_WORKER_MAX_CONCURRENCY:?prod worker concurrency must be 4; see deploy/README.md}"
      # 隔离边界（Trace #544 S-2b / 报告 W-1）：Agent SDK 回合的工作目录**必须**
      # 与用户环境根（lingxi-users 卷的挂载点 /var/lib/lingxi/users）互不包含。
      # 这不是洁癖：那个目录下每个用户各有一份 0440 的 .mcp.json，里面是**该用户
      # 专属的问数 MCP Bearer 明文**。把 cwd 设成用户目录根（或它的任何祖先/子孙），
      # 模型一次相对路径读取就能拿到别人的令牌——而 cwd 里的 .mcp.json 同时还是
      # Claude CLI 的项目级 MCP 配置来源。**这一行写在 compose 而不是外部 env 文件
      # 里是刻意的**：compose 的 `environment:` 覆盖 `env_file`，因此哪怕
      # .env.<环境>.worker-queue 里还留着一个不安全的旧值，也不再可能生效。
      # scripts/ci/check_deploy_contract.py 的 check_worker_workspace_isolation
      # 把这条边界钉成会变红的断言（用户目录根由 lingxi-users 挂载点推导，用户
      # 家目录的构造形状回读 adapters/user_environment.py 的 home_of）。
      LINGXI_WORKER_WORKSPACE: "/tmp/lingxi-workspace"
    # ---- 生产 worker-queue 资源合同（Issue #494/#502，2026-08-31）-----------
    # 产品负责人已确认生产机器型号与 stage 一致，worker-queue 合同为 CPU 1.5、
    # memory 2G、pids 512、tmpfs 256m。真实值仍由外部根 `deploy/.env.prod` 注入，
    # 这里保留 `${VAR:?}` 无默认值门，漏配或误配时 `docker compose config` 直接失败。
    #
    # 因此四项一律写成 `${VAR:?...}`（**无默认值**）：生产不是"少配一个变量就退回
    # 一个可能错的默认"，而是 `docker compose up` 直接报错退出。scripts/ci/
    # check_deploy_contract.py 的 check_worker_tmpfs_capacity / check_resource_limits
    # 把"prod 必须显式声明、不得沿用默认"钉成会变红的断言。
    #
    # **四条提示语必须是短的纯 ASCII 单行，详细说明只写在 deploy/README.md**
    # （PR #506 CI 实测教训）：compose 的值在被插值之前先过 YAML 解析，未加引号的
    # 标量遇到空格加 `#` 就被当成行内注释**从那里截断**——原来的提示语里带一个
    # `（Issue #494）`，YAML 把 `}` 连同后半句一起吃掉，剩下一个没有闭合的
    # `${...`，compose 报 `invalid interpolation format` 而不是我们要的"变量缺失"。
    # 同理不能出现冒号加空格（YAML 会当成映射键）。这条已由
    # `check_compose_interpolation_is_yaml_safe` 钉成门禁。
    tmpfs:
      - /tmp:mode=1777,size=${LINGXI_WORKER_QUEUE_TMPFS_SIZE:?prod worker tmpfs must be set in deploy/.env.prod; see deploy/README.md}
    deploy:
      resources:
        limits:
          cpus: "${LINGXI_WORKER_QUEUE_CPU_LIMIT:?prod worker CPU must be set in deploy/.env.prod; see deploy/README.md}"
          memory: ${LINGXI_WORKER_QUEUE_MEM_LIMIT:?prod worker memory must be set in deploy/.env.prod; see deploy/README.md}
          pids: ${LINGXI_WORKER_QUEUE_PIDS_LIMIT:?prod worker pids must be set in deploy/.env.prod; see deploy/README.md}
    volumes:
      - lingxi-users:/var/lib/lingxi/users
      # 与 stage 覆盖结构一致（部署门禁要求两侧只许值不同）：默认提示词等运行时
      # 可调配置的只读目录挂载，说明见 compose.stage.yaml 同位置注释与
      # .env.example「文件五」。未配置 LINGXI_WORKER_SYSTEM_PROMPT_FILE 时 worker
      # 不读它，行为与挂载前逐字节一致。
      - ${LINGXI_WORKER_RUNTIME_CONFIG_DIR:-/opt/lingxi/runtime-config}:/etc/lingxi/runtime:ro

  migrate:
    env_file:
      - ./.env.prod.migrate
    deploy:
      resources:
        limits:
          cpus: "${LINGXI_MIGRATE_CPU_LIMIT:-1.0}"
          memory: ${LINGXI_MIGRATE_MEM_LIMIT:-1G}
          pids: ${LINGXI_MIGRATE_PIDS_LIMIT:-512}

  reauthorize:
    env_file:
      - ./.env.prod.reauthorize
    deploy:
      resources:
        limits:
          cpus: "${LINGXI_REAUTHORIZE_CPU_LIMIT:-1.0}"
          memory: ${LINGXI_REAUTHORIZE_MEM_LIMIT:-1G}
          pids: ${LINGXI_REAUTHORIZE_PIDS_LIMIT:-512}
    volumes:
      - lingxi-credentials:/var/lib/lingxi/credentials

volumes:
  lingxi-credentials:
    name: lingxi-prod-credentials
  lingxi-users:
    name: lingxi-prod-users
