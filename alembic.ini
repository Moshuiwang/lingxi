; Alembic 配置（Issue #53）。生产表结构的权威来源是本文件指向的 revision 链，
; 见 migrations/README.md。
;
; **这里刻意没有 sqlalchemy.url。** 迁移连接串只来自环境变量 LINGXI_MIGRATION_DSN，
; 由 migrations/alembic/env.py 读取；缺失时明确失败而不是回落到某个默认库
; （断言 V-部署-01 / V-迁移-05）。留一个"能用的默认串"意味着有人在没设环境变量时
; 把迁移跑进了别的库，而且不会有任何提示。scripts/ci/check_alembic_revisions.py
; 会核对本文件不含带值的 sqlalchemy.url。

[alembic]
; %(here)s 是本文件所在目录：这样在仓库任何子目录下执行 alembic 都指向同一条链，
; 不依赖当前工作目录。
script_location = %(here)s/migrations/alembic

; revision id 由人指定（见 script.py.mako 的说明），不用随机十六进制：
; 接管旧库的命令要把它写进 migrations/README.md 与运维步骤，可读性直接影响可操作性。
; 长度上限 32 由 alembic_version.version_num 决定。
truncate_slug_length = 32

; 日志：alembic 自身的进度打到 stderr，供 CI 留痕（断言 V-迁移-03 的可观察输出）。
; sqlalchemy 保持 WARN——把 SQL 回显打开会把整段 DDL 刷进 CI 日志，且没有任何收益。
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
