<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1180" viewBox="0 0 1680 1180">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <style>
      .title{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:30px;font-weight:700;fill:#111827}
      .subtitle{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:16px;fill:#4b5563}
      .lane-title{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:18px;font-weight:700;fill:#111827}
      .node-title{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:17px;font-weight:700;fill:#111827}
      .node-text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:14px;fill:#374151}
      .small{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:13px;fill:#4b5563}
      .lane-bg{fill:#f8fafc}
      .lane-alt{fill:#ffffff}
      .lane-head{fill:#eef2ff}
      .node{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.4;rx:8}
      .user-node{fill:#eff6ff;stroke:#93c5fd}
      .bot-node{fill:#f0fdf4;stroke:#86efac}
      .approver-node{fill:#fff7ed;stroke:#fdba74}
      .system-node{fill:#f8fafc;stroke:#94a3b8}
      .admin-node{fill:#fef2f2;stroke:#fca5a5}
      .decision{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.5}
      .line{stroke:#334155;stroke-width:1.7;fill:none;marker-end:url(#arrow)}
      .dashed{stroke-dasharray:6 5}
      .note{fill:#ecfeff;stroke:#67e8f9;stroke-width:1.2;rx:8}
      .section{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:15px;font-weight:700;fill:#0f766e}
    </style>
  </defs>

  <rect x="0" y="0" width="1680" height="1180" fill="#f3f4f6"/>
  <text x="40" y="54" class="title">BI AI Agent 申请与补充授权角色泳道流程图</text>
  <text x="40" y="84" class="subtitle">产品口径：首次申请负责开户和登录材料交付；补充授权只追加权限，不重复开户；调岗收回旧权限是管理员独立动作。</text>

  <rect x="40" y="116" width="1600" height="90" class="lane-bg"/>
  <rect x="40" y="206" width="1600" height="180" class="lane-alt"/>
  <rect x="40" y="386" width="1600" height="160" class="lane-bg"/>
  <rect x="40" y="546" width="1600" height="260" class="lane-alt"/>
  <rect x="40" y="806" width="1600" height="150" class="lane-bg"/>
  <rect x="40" y="956" width="1600" height="150" class="lane-alt"/>

  <rect x="40" y="116" width="170" height="990" class="lane-head"/>
  <line x1="210" y1="116" x2="210" y2="1106" stroke="#cbd5e1"/>
  <line x1="40" y1="206" x2="1640" y2="206" stroke="#cbd5e1"/>
  <line x1="40" y1="386" x2="1640" y2="386" stroke="#cbd5e1"/>
  <line x1="40" y1="546" x2="1640" y2="546" stroke="#cbd5e1"/>
  <line x1="40" y1="806" x2="1640" y2="806" stroke="#cbd5e1"/>
  <line x1="40" y1="956" x2="1640" y2="956" stroke="#cbd5e1"/>
  <line x1="40" y1="1106" x2="1640" y2="1106" stroke="#cbd5e1"/>

  <text x="72" y="166" class="lane-title">阶段</text>
  <text x="72" y="300" class="lane-title">用户</text>
  <text x="72" y="466" class="lane-title">飞书 Bot / 卡片</text>
  <text x="72" y="676" class="lane-title">审批人</text>
  <text x="72" y="890" class="lane-title">后端授权系统</text>
  <text x="72" y="1038" class="lane-title">管理员 / HR</text>

  <text x="250" y="155" class="section">1. 入口与提交</text>
  <text x="600" y="155" class="section">2. 审批</text>
  <text x="920" y="155" class="section">3. 通过后的系统动作</text>
  <text x="1290" y="155" class="section">4. 后续变更</text>

  <rect x="245" y="242" width="220" height="96" class="node user-node"/>
  <text x="265" y="272" class="node-title">发消息给 Bot</text>
  <text x="265" y="300" class="node-text">无记录：发申请卡</text>
  <text x="265" y="323" class="node-text">已通过：可点申请更多授权</text>

  <rect x="245" y="420" width="220" height="104" class="node bot-node"/>
  <text x="265" y="450" class="node-title">按状态回卡片</text>
  <text x="265" y="478" class="node-text">首次：姓名、邮箱、公司、职能</text>
  <text x="265" y="501" class="node-text">补充：公司、职能、说明</text>

  <rect x="505" y="242" width="220" height="96" class="node user-node"/>
  <text x="525" y="272" class="node-title">填写并提交</text>
  <text x="525" y="300" class="node-text">一次只选一个公司</text>
  <text x="525" y="323" class="node-text">职能可多选</text>

  <rect x="505" y="420" width="220" height="104" class="node bot-node"/>
  <text x="525" y="450" class="node-title">校验 + 二次确认</text>
  <text x="525" y="478" class="node-text">不通过：字段提示，用户修改</text>
  <text x="525" y="501" class="node-text">通过：展示确认卡</text>

  <rect x="765" y="242" width="220" height="96" class="node user-node"/>
  <text x="785" y="272" class="node-title">确认提交</text>
  <text x="785" y="300" class="node-text">申请正式进入审核</text>
  <text x="785" y="323" class="node-text">旧入口卡不会重复建单</text>

  <rect x="765" y="420" width="220" height="104" class="node bot-node"/>
  <text x="785" y="450" class="node-title">推送审批群</text>
  <text x="785" y="478" class="node-text">展示申请人、公司、职能、说明</text>
  <text x="785" y="501" class="node-text">补充授权标注当前已有权限</text>

  <rect x="765" y="594" width="220" height="104" class="node approver-node"/>
  <text x="785" y="624" class="node-title">审批人处理</text>
  <text x="785" y="652" class="node-text">通过：进入授权开通</text>
  <text x="785" y="675" class="node-text">退回：必须填写理由</text>

  <rect x="1025" y="594" width="220" height="104" class="node approver-node"/>
  <text x="1045" y="624" class="node-title">退回分支</text>
  <text x="1045" y="652" class="node-text">用户收到退回理由</text>
  <text x="1045" y="675" class="node-text">再次发消息可重新申请</text>

  <rect x="1025" y="846" width="240" height="112" class="node system-node"/>
  <text x="1045" y="876" class="node-title">首次申请通过</text>
  <text x="1045" y="904" class="node-text">写用户与授权记录</text>
  <text x="1045" y="927" class="node-text">签发 token，创建账号</text>
  <text x="1045" y="950" class="node-text">邮件 ZIP + 飞书口令交付</text>

  <rect x="1305" y="846" width="240" height="112" class="node system-node"/>
  <text x="1325" y="876" class="node-title">补充授权通过</text>
  <text x="1325" y="904" class="node-text">合并式追加权限</text>
  <text x="1325" y="927" class="node-text">复用原 token</text>
  <text x="1325" y="950" class="node-text">不重复开户、不重复发 SSH 材料</text>

  <rect x="1305" y="424" width="240" height="104" class="note"/>
  <text x="1325" y="454" class="node-title">降级保留提示</text>
  <text x="1325" y="482" class="node-text">已有更高权限时仍允许申请</text>
  <text x="1325" y="505" class="node-text">通过后作为未来收回后的保留权限</text>

  <rect x="1025" y="1002" width="240" height="86" class="node bot-node"/>
  <text x="1045" y="1032" class="node-title">通知用户</text>
  <text x="1045" y="1060" class="node-text">展示本次申请和当前已生效权限</text>
  <text x="1045" y="1083" class="node-text">首次额外提示登录材料位置</text>

  <rect x="1305" y="1002" width="240" height="86" class="node admin-node"/>
  <text x="1325" y="1032" class="node-title">收回旧权限</text>
  <text x="1325" y="1060" class="node-text">调岗时由管理员明确执行</text>
  <text x="1325" y="1083" class="node-text">系统同步权限副本并通知用户</text>

  <rect x="690" y="846" width="245" height="112" class="node system-node"/>
  <text x="710" y="876" class="node-title">审批结果落库</text>
  <text x="710" y="904" class="node-text">申请状态从 pending 变更</text>
  <text x="710" y="927" class="node-text">按钮置灰，防重复操作</text>
  <text x="710" y="950" class="node-text">退回不写授权</text>

  <rect x="1305" y="594" width="240" height="104" class="node approver-node"/>
  <text x="1325" y="624" class="node-title">审批人看到全貌</text>
  <text x="1325" y="652" class="node-text">当前已有权限</text>
  <text x="1325" y="675" class="node-text">本次新增或保留权限</text>

  <path d="M465 290 H505" class="line"/>
  <path d="M615 338 V420" class="line"/>
  <path d="M725 472 H765" class="line"/>
  <path d="M875 524 V594" class="line"/>
  <path d="M985 646 H1025" class="line"/>
  <path d="M875 698 V846 H690" class="line"/>
  <path d="M935 902 H1025" class="line"/>
  <path d="M1245 902 H1305" class="line"/>
  <path d="M1145 958 V1002" class="line"/>
  <path d="M1425 958 V1002" class="line"/>
  <path d="M1025 646 C945 745 680 750 615 524" class="line dashed"/>
  <path d="M985 472 H1305" class="line dashed"/>
  <path d="M1425 528 V594" class="line dashed"/>
  <path d="M1425 698 V846" class="line"/>
  <path d="M1425 1088 C1510 1120 1575 1048 1545 950" class="line dashed"/>

  <text x="1000" y="832" class="small">通过后分流：新用户走开户；老用户走补充授权</text>
  <text x="470" y="742" class="small">退回后用户修改再提，不保留为有效授权</text>
  <text x="1278" y="1134" class="small">注意：补充授权不会自动删除旧权限；旧权限收回依赖管理员/HR 流程明确触发。</text>
</svg>
